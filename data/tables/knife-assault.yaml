id: knife-assault
order: 85
name: "Knife assault - stab wounds (forensic)"
label: "Knife assault (Stockholm homicides 1983-93)"
battle: "Close combat"
context: "Where stab and cut wounds were found on homicide victims, Stockholm 1983-1993. Used for knives and bayonets on any non-medieval table."
variant: evidence
native: armed
weapon_bias: pooled
armor: allowed
weapons: [dagger, bayonet]
modifiers: [attacker_higher, attacker_lower, target_down, target_fleeing, flanked, target_warding]
confidence: historical
confidence_note: "Region figures are from the source (share of victims wounded in each region; victims usually had several wounds, so they sum to more than 100 and are normalised). Arm wounds favour forearms and hands (defensive wounds); other splits use body exposure (design estimate)."
armor_note: >
  Victims were mostly unarmoured civilians, so these are hits before armour: armour can
  be applied. 41% of victims had defensive wounds to the hands and forearms, already
  included here, so 'warding' doubles up. Soft ballistic vests give little protection
  against a stab (pierce 0); plates stop it.
sources:
  - "Karlsson T., 'Sharp force homicides in the Stockholm area, 1983-1992', Forensic Sci Int 1998, via forensicmed.co.uk 'Patterns of sharp force trauma': share of homicide victims with wounds by region - head 27%, neck 33%, upper extremity 46%, chest 34%, back 34%, abdomen 26%, lower extremity 19%; defensive injuries in 41% of victims."
status: "Historical at region level. Homicide, not battle: single attacker, unarmoured victim, often surprised."
