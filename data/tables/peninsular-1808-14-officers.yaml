id: peninsular-1808-14-officers
order: 18
name: "Peninsular War 1808-14 - French officers' wounds"
label: "Wounded and killed: French officers' records"
battle: "Napoleonic era & War of 1812"
context: "Where French officers were hit in Spain and Portugal, 1808-1814, by musket, sabre, bayonet, lance and cannon. Mostly men who survived."
variant: evidence
armor: allowed
native: gunfire
also_native: [armed]
weapon_bias: sourced
weapons: [musket_smoothbore, rifle_flintlock, pistol_flintlock, artillery_smoothbore, saber, bayonet, lance]
modifiers: [attacker_higher, attacker_lower, target_down, target_fleeing, flanked, target_warding, behind_cover]
confidence: historical
confidence_note: >
  Location counts are from the source (3,995 wound events). Each weapon rolls on its own
  recorded distribution (musket 2,848, sword 284, bayonet 97, lance 43, ordnance 209 wounds).
  Left and right are not recorded and are split evenly; 'arm' (bras) is put on the upper
  arm because wrist and forearm are listed apart. Rifles and pistols use the musket data.
weapon_mix:
  - {label: "Musket, rifle and pistol", weapon: musket_smoothbore, pct: 76.42}
  - {label: "Artillery (shell, round shot, canister, grape)", weapon: artillery_smoothbore, pct: 8.05}
  - {label: "Sabre and sword", weapon: saber, pct: 6.91}
  - {label: "Bayonet", weapon: bayonet, pct: 3.19}
  - {label: "Lance", weapon: lance, pct: 1.33}
  - {label: "Contusion (spent ball, blow, fall)", pct: 4.10}
armor_note: >
  Almost no one wore body armour (cuirassiers and carabiniers had steel cuirasses, and
  dragoons and heavy cavalry helmets), so armour can be applied. The records are of men who
  survived far more often than of men killed (146 killed and 84 died of wounds against
  4,129 wounded), so head and trunk hits from gunfire are under-counted: use the all-hits
  table for gunfire in play. Edged weapons rarely killed (8 deaths among 424 sword, bayonet
  and lance casualties), so their columns are close to every hit they made.
sources:
  - "Planas Campos J. and Grajal de Blas A., 'Wounds & Weapons in the Napoleonic War: a database of the Peninsular War', British Journal for Military History 7(3), Nov 2021, pp. 117-127: Table 1 (weapons, 4,359 entries), Table 2 (locations, 3,995 events), Tables 6-8 (location by firearm, edged weapon and ordnance). Source registers: French Army officer files, SHD 2Yb."
  - "Same article, Table 11: 491 rank and file of the 100e de ligne - arms 22%, legs 40%, chest 6%, head 24%, abdomen 1%, shoulder 7% (officers: 26/44/4/14/3/9)."
  - "Comparison quoted there: Austrian officers wounded at Austerlitz (Guiga 2021) - upper limbs 26%, lower limbs 45%, head 6%, upper body 9%, back 4%."
status: >
  Historical. French officers, so mounted officers and men in the front rank are
  over-represented; the rank-and-file sample was hit in the head more often (24%). Tables
  7 and 8 were read from the article's table images.
