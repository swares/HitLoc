armor_note: >
  These weights are where blows LAND. Resolve armour separately with the target's kit: a
  man-at-arms in full harness, a retainer in brigandine and sallet, or an archer or billman
  in a jack.
sources:
  - "Derived from towton-1461-mass-grave (Holst and Sutherland 2014, Tab. 9 and 12)."
status: >
  The bone evidence is 74% head and neck, 21% arms, 5% legs and almost no trunk. Corrections:
  (1) Trunk raised to 30%: blade, spike and arrow wounds to the chest and belly mostly miss
  bone, and the evidence shows almost none. (2) Head and neck lowered to 31%: many Towton
  skull wounds were struck after a man fell or lost his helmet in the rout (14 on one skull).
  (3) Arms kept at about a fifth, hands and forearms highest (defence wounds). (4) Legs
  raised to 18%: deep thigh wounds often miss the femur. The left-over-right skull bias
  (48 against 29 wounds) is kept.
