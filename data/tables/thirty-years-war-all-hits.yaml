armor_note: >
  Use this table for gunfire in play; armour applies (cuirassier, harquebusier and pikeman
  kits). Sabres and clubbed muskets roll on their own tables (the Peninsular records and
  the Visby melee table).
sources:
  - "Derived (tools/blend_tables.py): 74.5% peninsular-1808-14-officers (wounded) + 25.5% lutzen-1632-mass-grave (killed), location by location."
  - "No wounded records survive for the Thirty Years' War; the Peninsular War officers' wounds (same smoothbore lead balls and swords, 180 years later) stand in. Killed share as for the Napoleonic blend (about 1 killed to 3 wounded)."
status: >
  Estimated. The killed part is real 1632 evidence but bone-only, so it under-counts trunk
  wounds; the wounded part is borrowed from a later war. Edit the share in
  tools/blend_tables.py if you prefer another.
