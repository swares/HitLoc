status: >
  Corrections to the bone evidence: (1) The 24 blade cuts across the back of the neck are left
  out as probable executions of captives; the neck keeps a small share for battle blows.
  (2) Trunk raised to 30%: chest and belly wounds mostly miss bone (the evidence has 10 torso
  bones in 100). (3) Head kept near its share of the remaining bones (22%). (4) Arms lowered
  from 38% to 24% and legs and hips from 26% to 24% to make room for the trunk. Sides are not recorded,
  so left and right are near even.
