id: war-1812-all-hits
order: 19.5
name: "War of 1812 - all hits (gameplay, borrowed records)"
label: "All hits: gameplay blend (Peninsular records)"
battle: "War of 1812"
context: "Where musket balls, rifle balls and shot land on a man in the open or in the woods, before survival sorts the records. No wound count survives for this war; the table is built from the Peninsular War records."
variant: adjusted
armor: allowed
weapon_bias: pooled
weapons: [musket_smoothbore, rifle_flintlock, pistol_flintlock, artillery_smoothbore, saber, bayonet]
modifiers: [attacker_higher, attacker_lower, target_fleeing, flanked, behind_cover]
confidence: extrapolated
confidence_note: "Borrowed: the Peninsular War wounded table blended with a stand-in killed table, at this war's own killed share."
armor_note: >
  Use this table for play. No armour was worn in North America (some light dragoons had
  leather helmets), so leave it off. For a tomahawk or war club use the axe or spiked
  club, which roll on the Visby close-combat data. Much woodland and skirmish fighting
  makes 'behind cover' common.
sources:
  - "Derived (tools/blend_tables.py): 66.6% peninsular-1808-14-officers + 33.4% acw-1861-killed, location by location."
  - "Killed share: US forces lost about 2,260 killed in action and 4,505 wounded (commonly cited totals; British and Canadian losses are usually given only combined)."
  - "Peninsular War records: Planas Campos and Grajal de Blas, British Journal for Military History 7(3), 2021."
status: >
  Estimated and borrowed. No count of wounds by body region has been found for the War of
  1812. The weapons and drill were those of the Napoleonic Wars and many British regulars
  were Peninsular veterans, so the French officers' records stand in for the wounded and
  the Civil War killed-in-action table (also soft lead balls) for the dead. Edit the share
  in tools/blend_tables.py if you prefer another.
