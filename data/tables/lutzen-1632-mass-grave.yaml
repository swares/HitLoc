id: lutzen-1632-mass-grave
order: 13
name: "Lützen 1632 - mass grave (bone evidence)"
label: "Bone evidence: mass grave of 47"
battle: "Thirty Years' War"
context: "Battle injuries on 47 men buried in one grave at Lützen, most likely infantry of the Swedish Blue Brigade cut down by imperial cavalry. Killed only."
variant: evidence
armor: allowed
native: gunfire
also_native: [armed]
weapon_bias: sourced
weapons: [wheellock_pistol, matchlock_musket, saber, musket_butt]
modifiers: [attacker_higher, attacker_lower, target_down, target_fleeing, flanked, target_warding, behind_cover]
confidence: historical
confidence_note: >
  Counted from the study's tables of reliable battle injuries (69: 32 projectile, 21 blunt,
  16 sharp), each weapon rolling on its own mechanism's injuries. Sides are as recorded;
  injuries the authors only call probable are left out. Where a bone could belong to more
  than one location (vertebra, ribcage, cranial base), it is shared by body exposure.
weapon_mix:
  - {label: "Lead ball (pistol, carbine, musket)", weapon: wheellock_pistol, pct: 46.4}
  - {label: "Blunt force (musket butt, hilt, horse)", weapon: musket_butt, pct: 30.4}
  - {label: "Sharp force (sword, rapier, halberd)", weapon: saber, pct: 23.2}
armor_note: >
  The men wore little or no armour ('insufficient head protection', the authors note), so
  armour can be applied. This is bone evidence: wounds to soft tissue, above all the belly
  and chest, left no mark, so the trunk is under-counted. Some blunt facial fractures may
  come from the burial rather than the battle. For play, use the all-hits table.
sources:
  - "Nicklisch N., Ramsthaler F., Meller H., Friederich S., Alt K.W., 'The face of war: Trauma analysis of a mass grave from the Battle of Lützen (1632)', PLoS ONE 12(5): e0178252 (2017), open access (PMC5439951): Tables 1, 3 and 4."
  - "Same study: lead balls in the grave were mostly from carbines (12-14), then muskets (5) and pistols (1-3); 21 men had gunshot wounds to the head; the attack came mainly from the front and side."
  - "Injury tally: data/sources/lutzen-1632-mass-grave.csv."
status: >
  Historical, from one small grave (47 men, 69 reliable injuries) and one moment of the
  battle: a cavalry charge with pistols and carbines aimed at the head, as contemporary
  instructions advised. Not a picture of the whole war.
