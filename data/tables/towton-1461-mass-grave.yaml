id: towton-1461-mass-grave
order: 12
name: "Towton 1461 - mass grave (bone evidence)"
label: "Bone evidence: Towton Hall mass grave"
battle: "Wars of the Roses"
context: "Death wounds on the men buried at Towton Hall after the battle of 29 March 1461, most likely Lancastrians caught in the rout. Killed only."
variant: evidence
native: armed
weapon_bias: sourced
weapons: [sword, bill, poleaxe, dagger, longbow, bow]
modifiers: [weapon_side, attacker_higher, attacker_lower, target_down, target_fleeing, flanked, target_warding]
confidence: historical
confidence_note: >
  Counted wound by wound from the study's tables: 124 head wounds (79 blade, 32 blunt,
  13 penetrating) on 31 skulls and 56 injured bones below the head (52 blade, 4 blunt). Head
  wounds are counted per wound and body injuries per bone, as published, so the body is
  slightly under-counted. Blade weapons roll on the blade wounds, the poleaxe on the blunt
  ones and the dagger on the penetrating ones (arrow, bolt, dagger and poleaxe-spike wounds
  to the skull). Bows use all the wounds together. Unsided skull wounds (frontal, occipital,
  both parietals) are shared between left and right.
armor_note: >
  Armour is already in these numbers: the head wounds suggest many men had lost or taken off
  their helmets in the rout, and the wounds fall where they were unprotected. Do not also subtract armour on this
  table; use the all-hits table for play. This is bone evidence, so wounds to the chest and
  belly that touched no bone left no mark, and arrows (which mostly wounded soft tissue) are
  under-counted.
sources:
  - "Holst M. and Sutherland T., 'Towton Revisited - Analysis of the Human Remains from the Battle of Towton 1461', in Eickhoff S. and Schopper F. (eds), Schlachtfeld und Massengrab: Spektren interdisziplinärer Auswertung von Orten der Gewalt (Zossen 2014), pp. 97-129: Tab. 9 (post-cranial injuries) and Tab. 12 (peri-mortem cranial weapon trauma)."
  - "Same chapter: 36% of the skeletons had peri-mortem injuries below the head (56 in all), mostly to the hands and forearms; the back of the skull, left parietal and left frontal took the most blade wounds. Its text gives 33 blunt (25%) and 13 penetrating (10%) head wounds; its table lists 124 head wounds, which this table follows."
  - "Fiorato V., Boylston A. and Knüsel C. (eds), Blood Red Roses: the archaeology of a mass grave from the Battle of Towton AD 1461 (Oxbow, 2000; 2nd ed. 2007): the original excavation and analysis (Novak, 'Battle-related trauma')."
  - "Wound-by-wound tally: data/sources/towton-1461-mass-grave.csv."
status: >
  Historical, from one grave of about 38 men killed in the rout after the battle. Their
  wounds are extreme: one man (skeleton 32) had 14 head wounds, many blows fell on the
  back of the skull and the neck, and the forearms and hands show defence wounds. It is a
  picture of men cut down while fleeing or after they fell, not of the fighting in the line.
