confidence_note: "Blend of a historical wounded table and a stand-in killed table; the mix is from casualty totals."
armor_note: >
  Use this table for play. Armour applies (cuirassiers' breastplates and cavalry helmets).
  Sabres, bayonets and lances roll on the Peninsular records, where edged weapons rarely
  killed, so those records already include nearly every edged hit.
sources:
  - "Derived (tools/blend_tables.py): 74.5% peninsular-1808-14-officers + 25.5% acw-1861-killed, location by location."
  - "Killed share: about one killed for every three wounded in the Anglo-allied army at Waterloo (about 3,500 killed and 10,200 wounded; approximate, commonly cited totals)."
status: >
  Estimated. The Peninsular records hold only 146 killed outright (head and chest most
  often), too few to use, so the Civil War killed-in-action table (also soft lead balls)
  stands in for the dead. Edit the share in tools/blend_tables.py if you prefer another.
