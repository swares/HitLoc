  "Vietnam":
    period: "1965-1973 (major US involvement)"
    summary: >
      South Vietnam, the United States and allies (Australia, New Zealand, South Korea,
      Thailand) against North Vietnam's army (PAVN) and the southern Viet Cong. Most
      wounds came from fragments; mines and booby traps caused 15% of wounds and punji
      stakes 2%, while bullets killed far more often than they wounded.
    sides:
      - name: "US and allies"
        who: "South Vietnamese army (ARVN), US Army and Marine Corps, and Australian, New Zealand, South Korean and Thai contingents."
        armour: "M1 steel helmet; Army M69 nylon vest, Marine M1955 vest with Doron plates. Both stopped fragments, not AK rounds, and in the heat they were often left behind on patrol."
        look: {colour: "#4f5a3a", helmet: m1, beard: stubble}
      - name: "PAVN and Viet Cong"
        who: "People's Army of Vietnam regulars; Viet Cong guerrillas."
        armour: "None. The PAVN pith helmet gave no ballistic protection. They relied on concealment, mines and booby traps."
        look: {colour: "#5f6b3a", hat: pith}
    examples:
      - {name: "US Army infantryman, 1968", side: "US and allies", kit: vietnam_army, weapon: rifle_assault, notes: "M1 helmet, M69 vest, M16."}
      - {name: "US Marine, Hue 1968", side: "US and allies", kit: vietnam_usmc, weapon: rifle_assault, notes: "M1955 vest, urban fighting."}
      - {name: "ARVN infantryman", side: "US and allies", kit: ww2_rifleman, weapon: rifle_assault, notes: "South Vietnamese army: M1 helmet, usually no vest; M16 from 1968, carbines before."}
      - {name: "Australian infantryman, 1968", side: "US and allies", kit: none, weapon: rifle_assault, notes: "Bush hat, no body armour; L1A1 SLR.", look: {colour: "#4f5a3a", hat: boonie}}
      - {name: "South Korean marine", side: "US and allies", kit: ww2_rifleman, weapon: rifle_assault, notes: "ROK Marine Corps: M1 helmet."}
      - {name: "PAVN regular", side: "PAVN and Viet Cong", kit: none, weapon: rifle_assault, notes: "Pith helmet, AK-47."}
      - {name: "Viet Cong guerrilla", side: "PAVN and Viet Cong", kit: none, weapon: mine_ied, notes: "Booby traps, mines and punji pits.", look: {colour: "#2b2b2b", trousers: "#2b2b2b", hat: none}}
    sources:
      - "Neel, Medical Support of the U.S. Army in Vietnam (1973), ch. 3, Table 6."
      - "Wikipedia, 'Flak jacket' (M69 and M1955 protection)."

  "Late 20th century":
    period: "1969-1996"
    summary: >
      Six smaller wars with very different fighting. Northern Ireland (1969-98): the
      British Army and police against the Provisional IRA, mostly sniping and bombs.
      The Falklands (1982): Britain against Argentina, infantry fighting over open
      hills. The Gulf War (1991): a US-led coalition against Iraq. Somalia (1993): US
      Rangers and special forces against Somali militia in Mogadishu. Chechnya (1994-96
      and later): Russia against Chechen separatists, with urban battles in Grozny.
    sides:
      - name: "Northern Ireland"
        who: "British Army and RUC; Provisional IRA and other paramilitaries."
        armour: "British patrols wore helmets and soft body armour; the IRA wore none and used rifles, snipers and bombs."
        look: {colour: "#6b6a4a"}
      - name: "Falklands 1982"
        who: "British paratroopers, Royal Marines and infantry; Argentine conscripts and marines."
        armour: "Steel helmets on both sides; little body armour."
        look: {colour: "#6b6a4a", helmet: brodie}
      - name: "Gulf War 1991"
        who: "US-led coalition; Iraqi army."
        armour: "US troops in PASGT Kevlar helmets and vests (fragments and pistol rounds); Iraqi troops in steel helmets."
        look: {colour: "#c2ab7a"}
      - name: "Somalia 1993"
        who: "US Task Force Ranger; Somali National Alliance militia."
        armour: "Rangers wore IIIA soft vests with a single ceramic front plate and no back plate; militia were unarmoured, with AKs and RPGs."
        look: {colour: "#a99b72"}
      - name: "Chechnya"
        who: "Russian army and interior troops; Chechen separatist fighters."
        armour: "Russian helmets and body armour, unevenly issued; Chechen fighters largely unarmoured."
        look: {colour: "#5f6b3a", helmet: soviet}
    examples:
      - {name: "British soldier, Belfast", side: "Northern Ireland", kit: pasgt, weapon: rifle_assault, notes: "Soft body armour and helmet (PASGT used as the nearest kit).", look: {helmet: pasgt, hat: beret}}
      - {name: "IRA sniper", side: "Northern Ireland", kit: none, weapon: rifle_assault, notes: "Armalite, no armour.", look: {colour: "#3a3a3a", trousers: "#2f3540", hat: balaclava}}
      - {name: "British Guardsman, Tumbledown", side: "Falklands 1982", kit: ww2_rifleman, weapon: bayonet, notes: "Steel helmet; the final assaults on the mountains ended with the bayonet."}
      - {name: "Argentine conscript", side: "Falklands 1982", kit: ww2_rifleman, weapon: rifle_assault, notes: "Steel helmet, FN FAL.", look: {colour: "#5d6449", helmet: m1}}
      - {name: "US soldier, Desert Storm", side: "Gulf War 1991", kit: pasgt, weapon: rifle_assault, notes: "PASGT helmet and vest, M16.", look: {helmet: pasgt}}
      - {name: "British soldier, Desert Storm", side: "Gulf War 1991", kit: pasgt, weapon: rifle_assault, notes: "Soft body armour and helmet (PASGT used as the nearest kit)."}
      - {name: "Iraqi conscript", side: "Gulf War 1991", kit: ww2_rifleman, weapon: rifle_assault, notes: "Steel helmet, AK-47.", look: {colour: "#6b6a4a", helmet: m1}}
      - {name: "US Ranger, Mogadishu", side: "Somalia 1993", kit: ranger_1993, weapon: rifle_assault, notes: "Front plate only."}
      - {name: "Somali militiaman", side: "Somalia 1993", kit: none, weapon: rpg, notes: "No armour; AK-47 and RPG-7.", look: {colour: "#d8d0b8", trousers: "#4a4f55", hat: none}}
      - {name: "Russian conscript, Grozny 1995", side: "Chechnya", kit: ww2_rifleman, weapon: rifle_assault, notes: "Steel helmet; body armour often missing.", look: {helmet: soviet}}
      - {name: "Chechen fighter, Grozny", side: "Chechnya", kit: none, weapon: rpg, notes: "Urban ambush teams.", look: {colour: "#3f4a3a", hat: none, beard: beard}}
    sources:
      - "Wikipedia, 'Ranger Body Armor' (front plate only in 1993)."
      - "Borden Institute, Weapons Effects and War Wounds, Table 1-2 (wound distributions)."

  "Iraq & Afghanistan":
    period: "2001-2021"
    summary: >
      US-led coalitions in Afghanistan from 2001 (against the Taliban and al-Qaeda) and
      in Iraq from 2003 (against the Iraqi army, then insurgents and militias). Roadside
      bombs became the main weapon against coalition troops, and modern body armour
      moved wounds from the torso to the head, face and limbs.
    sides:
      - name: "Coalition"
        who: "US, British and other allied forces; the Afghan and new Iraqi security forces they trained."
        armour: "Interceptor vests with SAPI rifle plates and Kevlar helmets from the start of the Iraq war; ESAPI plates against armour-piercing rounds by the mid-2000s; lighter plate carriers later, especially in Afghanistan."
        look: {colour: "#a69a74", beard: stubble}
      - name: "Iraqi army, 2003"
        who: "Iraqi regular army and Republican Guard during the invasion."
        armour: "Steel helmets for some; little body armour."
        look: {colour: "#6b6a4a"}
      - name: "Insurgents and Taliban"
        who: "Iraqi insurgents and militias; Taliban fighters."
        armour: "Largely unarmoured. IEDs, RPGs, rifles and mortars."
        look: {colour: "#d8d0b8", trousers: "#cfc6ae", hat: turban, beard: beard}
    examples:
      - {name: "US soldier, Iraq 2004", side: "Coalition", kit: interceptor, weapon: rifle_assault, notes: "Interceptor vest, SAPI plates, ACH."}
      - {name: "US soldier, Afghanistan 2011", side: "Coalition", kit: plate_carrier, weapon: rifle_assault, notes: "Plate carrier with ESAPI."}
      - {name: "British soldier, Helmand 2009", side: "Coalition", kit: interceptor, weapon: rifle_assault, notes: "Osprey vest with plates (Interceptor used as the nearest kit).", look: {colour: "#a39573"}}
      - {name: "Afghan National Army soldier", side: "Coalition", kit: pasgt, weapon: rifle_assault, notes: "Helmet and vest when issued (PASGT used as the nearest kit).", look: {colour: "#6b6a4a", helmet: pasgt}}
      - {name: "Iraqi soldier, 2003", side: "Iraqi army, 2003", kit: ww2_rifleman, weapon: rifle_assault, notes: "Steel helmet, AK-47.", look: {helmet: m1}}
      - {name: "Insurgent, Iraq", side: "Insurgents and Taliban", kit: none, weapon: mine_ied, notes: "Roadside bombs.", look: {hat: shemagh}}
      - {name: "Taliban fighter", side: "Insurgents and Taliban", kit: none, weapon: rifle_assault, notes: "AK-47, no armour."}
    sources:
      - "Owens et al., J Trauma 2008; Borden Institute, Table 1-1 (DoD Trauma Registry 2007-17)."

  "Reference":
    period: ""
    summary: >
      Not a war. The random-hit table shows where hits would land if every square inch
      of the body were equally likely: use it as a neutral table with any armour, or to
      see how far a real war's pattern moves away from chance. Below it, the four-war
      comparison shows how American wound patterns changed from WWII to Iraq and
      Afghanistan, counted the same way each time; each of those four tables is listed
      under its own war as the Owens comparison set.
    sides: []
    examples:
      - {name: "Modern soldier", side: "-", kit: plate_carrier, weapon: rifle_assault, notes: "Plate carrier and helmet.", look: {colour: "#a69a74"}}
      - {name: "Police officer", side: "-", kit: police_iiia, weapon: pistol_smg, notes: "Concealable IIIA vest.", look: {colour: "#1d2433", trousers: "#1d2433", hat: police_cap}}
      - {name: "Civilian", side: "-", kit: none, weapon: pistol_smg, notes: "No armour.", look: {colour: "#5a6b7a", trousers: "#3a4250"}}
    comparison:
      title: "US wars compared: where hospitalized wounded were hit"
      note: >
        Same source and counting rule for every row: hospitalized casualties, including
        men who later died of wounds. With modern body armour the thorax share fell to
        6% and the head and neck rose to 30%, because plates cover the chest and nothing
        covers the face and neck. Gunshot vs explosion shows how the weapon mix shifted.
      columns: ["Head & neck", "Thorax", "Abdomen", "Extremities", "Gunshot / explosion"]
      rows:
        - ["Body surface area (chance)", "12%", "16%", "11%", "61%", "-"]
        - ["WWII", "21%", "14%", "8%", "58%", "27 / 73"]
        - ["Korea", "21%", "10%", "9%", "60%", "31 / 69"]
        - ["Vietnam", "16%", "13%", "10%", "61%", "35 / 65"]
        - ["Iraq & Afghanistan", "30%", "6%", "9%", "55%", "19 / 81"]
      source: "Owens et al., 'Combat wounds in Operation Iraqi Freedom and Operation Enduring Freedom', J Trauma 2008 (National Academies 2014, Tables 3-2 and 3-4)."
    sources: []

  "Close combat":
    period: "Stockholm, 1983-1993"
    summary: >
      Knife killings recorded by forensic pathologists: usually one attacker against an
      unarmoured, often surprised victim, with several wounds each. The table stands in
      for knives and bayonets on every non-medieval table.
    sides:
      - name: "Attacker"
        who: "Single assailant with a knife."
        armour: "None."
        look: {colour: "#3a3a3a", trousers: "#2f3540"}
      - name: "Victim"
        who: "Usually unarmoured civilians; 41% had defensive wounds on the hands and arms."
        armour: "None. Soft ballistic vests give little protection against a stab; plates stop one."
        look: {colour: "#5a6b7a", trousers: "#3a4250"}
    examples:
      - {name: "Knife attacker", side: "Attacker", kit: none, weapon: dagger, notes: "Single assailant."}
      - {name: "Police officer", side: "Victim", kit: police_iiia, weapon: dagger, notes: "IIIA vest: stops bullets, not knives.", look: {colour: "#1d2433", trousers: "#1d2433", hat: police_cap}}
      - {name: "Soldier in plates", side: "Victim", kit: plate_carrier, weapon: bayonet, notes: "Plates stop most stabs to the chest.", look: {colour: "#a69a74"}}
      - {name: "Civilian", side: "Victim", kit: none, weapon: dagger, notes: "No armour."}
    sources:
      - "Karlsson 1998, via forensicmed.co.uk."

