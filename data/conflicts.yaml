# Conflict background, keyed by each table's `battle` group.
# sides    - who fought and how each side used armour (prose; facts as sourced)
# examples - ready-made combatants: an armour kit (armor.yaml) and a typical weapon
#            (weapons.yaml) for that side. The kit is what they wear as a TARGET;
#            the weapon is what they use when they ATTACK.
# map      - locator map: bbox [west, south, east, north] in degrees, sites (name, lat, lon)
#            where the records come from (context: true = fought there, but no records
#            used; drawn hollow), optional borders: true (modern borders; only
#            for wars fought within today's borders) and highlight: [country names].
#            A list of such maps draws them side by side (label names each panel).
#            After editing, run: cd tools/maps && npm ci && node make_maps.mjs (writes data/maps.json)
# look     - how the example figures are drawn (templates/figure.js), on a side or an example
#            (an example's look is merged over its side's): colour, trousers, coat: skin,
#            hat (when the kit has no helmet), helmet (shape, when it has one), beard,
#            shield (heater or round; drawn when the kit has a shield)
#            elsewhere: true - the weapon is recorded only in another group's tables (no
#            data for it in this war); the roller offers to switch tables when he attacks.
# image    - optional picture of such a combatant: {file: <Wikimedia Commons file name,
#            without "File:">, caption: <what it shows, who made it and when>}. Period
#            images only (art, photographs or objects of the time; no reenactors); say in
#            the caption when it is a near match (another year, unit or army).

conflicts:
  "Crusades":
    period: "Sidon, 1253 or 1260"
    map: {bbox: [30.5, 29.5, 39.5, 37.5], sites: [{name: Sidon, lat: 33.56, lon: 35.37}]}
    summary: >
      From 1099 to 1291 Frankish crusader states held the coast of the Levant. Sidon, a
      walled port in today's Lebanon, was sacked twice in the 13th century: in 1253 by an
      army from Damascus while Louis IX of France was rebuilding its walls (Joinville
      describes the king helping to bury the rotting dead), and in 1260 by the Mongols
      under Kitbuqa. Two mass graves in the town ditch near St Louis' castle, dated to
      the mid-13th century, hold at least 25 men, Europeans and locals, killed in one of
      these attacks; their bones show sword, axe and mace wounds, many from behind.
    sides:
      - name: "Defenders of Sidon"
        who: "Frankish knights and sergeants, crossbowmen and townsmen of mixed European and Near Eastern descent."
        armour: "Knights and many sergeants in mail hauberks with helmets and shields; others in padded coats or nothing."
        look: {colour: "#e6e0d2", trousers: "#6b5d45", beard: beard}
      - name: "Attackers"
        who: "The army from Damascus that sacked the town in 1253, or the Mongols in 1260; which raid filled the graves is not known."
        armour: "Horsemen in mail or lamellar with round shields, lance, sword, mace and bow; Mongol horse archers in lamellar or padded coats."
        look: {colour: "#b3812f", trousers: "#5c4a3a", hat: turban, beard: beard, shield: round}
    examples:
      - {name: "Frankish knight", side: "Defenders of Sidon", kit: hauberk, weapon: sword, look: {helmet: closed}, notes: "Mail hauberk, great helm and shield.", image: {file: "Crusaders-middle-ages.jpg", caption: "Knights in battle, from the Crusader (Morgan) Bible, France, 1240s"}}
      - {name: "Frankish sergeant", side: "Defenders of Sidon", kit: hauberk, weapon: axe, notes: "Heavy blade wounds at Sidon point to swords and axes.", image: {file: "Morgan-bible-fl-29.jpg", caption: "Armoured foot and horse soldiers, from the Crusader (Morgan) Bible, France, 1240s"}}
      - {name: "Crossbowman", side: "Defenders of Sidon", kit: gambeson, weapon: crossbow, notes: "Padded coat; the town's walls were still being rebuilt in 1253."}
      - {name: "Townsman", side: "Defenders of Sidon", kit: none, weapon: spear, notes: "Caught in the sack."}
      - {name: "Syrian horseman", side: "Attackers", kit: hauberk, weapon: spiked_club, look: {helmet: pot}, notes: "Mace blows from the saddle: the Sidon wounds fall on the head, neck and shoulders.", image: {file: "A Mamluk Training with a Lance.jpeg", caption: "Mamluk horseman training with a lance, Egypt or Syria, c. 1500 (a later near match)"}}
      - {name: "Mongol horse archer", side: "Attackers", kit: leather, weapon: bow, look: {colour: "#7a3b2e", hat: winter_cap}, notes: "Kitbuqa's raid of 1260.", image: {file: "MongolCavalrymen.jpg", caption: "Mongol horsemen, from Rashid al-Din's Jami' al-tawarikh, early 14th century"}}
    sources:
      - "Mikulski R.N.R. et al., 'Weapon injuries in the crusader mass graves from a 13th century attack on the port city of Sidon (Lebanon)', PLoS ONE 16(8): e0256517 (2021)."
      - "Joinville, Life of Saint Louis, on Louis IX burying the dead of Sidon (1253)."

  "Visby 1361":
    period: "27 July 1361"
    map: {bbox: [9, 53.5, 25, 60.8], sites: [{name: Visby, lat: 57.64, lon: 18.30}]}
    summary: >
      King Valdemar IV Atterdag of Denmark invaded Gotland, then a rich trading island,
      and met its rural defenders outside the walls of Visby. The Gotlanders were a
      peasant levy facing professional troops, and the fight became a slaughter. The
      dead were buried quickly in mass graves, many still in their armour, which is why
      Visby gives the best picture of medieval battle wounds: 1,185 skeletons were
      recovered from three graves.
    sides:
      - name: "Danish army"
        who: "Professional soldiers of Valdemar IV."
        armour: "Mail, coats of plates and plate helmets; the best-equipped wore gauntlets and leg harness. Few of their dead are in the graves."
        look: {colour: "#8e2b2b", beard: beard}
      - name: "Gotlandic levy"
        who: "Farmers and freeholders of rural Gotland, called out to defend the island."
        armour: "Uneven. Many wore mail coifs and padded coats; some had coats of plates and gauntlets; many had little or nothing on the legs, which took most of the blade wounds."
        look: {colour: "#8a7a5c", trousers: "#6b5d45", hat: hood, beard: beard}
    examples:
      - {name: "Gotland levy", side: "Gotlandic levy", kit: gotland_levy, weapon: spear, notes: "Coif and padded coat; legs bare.", image: {file: "Fornsalen - Invasion 1361 - Schädel mit Kettenhaube 1.jpg", caption: "Mail coif still on a skull from the Visby mass graves (Gotland Museum)"}}
      - {name: "Gotland freeholder", side: "Gotlandic levy", kit: gotland_armoured, weapon: axe, notes: "Wealthier farmer in a coat of plates.", image: {file: "Korsbetningen - KMB - 16001000018315.jpg", caption: "Coat of plates no. 7 from mass grave 2 at Visby"}}
      - {name: "Danish man-at-arms", side: "Danish army", kit: danish_maa, weapon: sword, notes: "Fully harnessed professional.", image: {file: "Valdemar Atterdag.jpg", caption: "Valdemar IV Atterdag, who took Visby, armed with sword and shield (drawing of the c. 1375 Næstved fresco)"}}
      - {name: "Danish sergeant", side: "Danish army", kit: transitional, weapon: spiked_club, notes: "Coat of plates and mail; the spiked club matches square holes in Visby skulls."}
      - {name: "Danish crossbowman", side: "Danish army", kit: transitional, weapon: crossbow, notes: "126 arrow and bolt wounds were found among the Gotland dead.", image: {file: "Battle of Crecy (crossbowmen).jpg", caption: "Crossbowmen at Crécy (1346), painted about a century later"}}
    sources:
      - "Swedish History Museum, 'Skull from the Battle of Visby'."
      - "Medievalists.net, 'Medieval battle injuries' (2024), summarising Ingelmark in Thordeman (1939)."

  "Wars of the Roses":
    period: "Towton, 29 March 1461"
    map: {bbox: [-6.5, 50, 2, 56.2], sites: [{name: Towton, lat: 53.83, lon: -1.27}]}
    summary: >
      The Wars of the Roses (1455-1485) were fought between the houses of York and
      Lancaster for the English crown. At Towton in Yorkshire on Palm Sunday 1461, the
      Yorkist army of Edward IV defeated Henry VI's Lancastrians in a snowstorm, after an
      archery exchange and hours of fighting on foot; the Lancastrian army broke and was cut
      down in the rout. Contemporary claims of 28,000 dead are thought exaggerated, but it is
      often called the bloodiest battle fought in England. In 1996 building work at Towton
      Hall uncovered a mass grave of about 38 men, which gives the most detailed picture of
      medieval battle wounds yet recorded.
    sides:
      - name: "Yorkists"
        who: "Edward IV's army: his retinue and those of Warwick, Fauconberg and (late in the day) Norfolk."
        armour: "Nobles and men-at-arms in full plate, fighting on foot; retainers in brigandines and sallets; archers and billmen in padded jacks and sallets."
        look: {colour: "#6b2140", trousers: "#2f4f8f"}
      - name: "Lancastrians"
        who: "Henry VI's army under the Duke of Somerset, raised largely from the north."
        armour: "The same mix as the Yorkists. The head wounds in the Towton grave suggest many of the dead had lost or taken off their helmets in the rout."
        look: {colour: "#2c4f86", trousers: "#d8d4c8"}
    examples:
      - {name: "Yorkist man-at-arms", side: "Yorkists", kit: full_plate, weapon: poleaxe, notes: "Full harness, fighting on foot with the poleaxe.", image: {file: "MS Ghent - Battle of Barnet.jpg", caption: "Edward IV's army at Barnet, 1471, from the Ghent manuscript painted a few years later"}}
      - {name: "Yorkist archer", side: "Yorkists", kit: jack_sallet, weapon: longbow, notes: "By the traditional account, shot with the wind and snow at his back.", image: {file: "Arcieri inglesi battaglia di Crécy.jpg", caption: "English longbowmen at Crécy, from a 15th-century Froissart manuscript (painted a century after the battle, near Towton's time)"}}
      - {name: "Yorkist billman", side: "Yorkists", kit: jack_sallet, weapon: bill, notes: "Jack, sallet and bill: the common infantryman."}
      - {name: "Lancastrian man-at-arms", side: "Lancastrians", kit: full_plate, weapon: sword, notes: "Full harness; sword and dagger in the press.", image: {file: "Battle of Campston Hill, from the 1914 edition of the Pageant of the birth, life and death of Richard Beauchamp, Earl of Warwick, K.G.png", caption: "Men-at-arms in battle, from the Beauchamp Pageant (English drawings of c. 1483-94)"}}
      - {name: "Lancastrian retainer", side: "Lancastrians", kit: brigandine_sallet, weapon: bill, notes: "A lord's better-equipped retainer.", image: {file: "Mid 15th century brigandine.jpg", caption: "Soldier in a brigandine, from a Breton manuscript of the 1440s"}}
      - {name: "Lancastrian archer", side: "Lancastrians", kit: jack_sallet, weapon: longbow, notes: "By the traditional account, shot into the wind and fell short.", image: {file: "Battle of crecy froissart.jpg", caption: "English and Genoese archers at Crécy, from a 15th-century Froissart manuscript (a near match in time)"}}
    sources:
      - "Fiorato V., Boylston A. and Knüsel C. (eds), Blood Red Roses: the archaeology of a mass grave from the Battle of Towton AD 1461 (Oxbow, 2000; 2nd ed. 2007)."
      - "Holst M. and Sutherland T., 'Towton Revisited', in Eickhoff and Schopper (eds), Schlachtfeld und Massengrab (2014), pp. 97-129."

  "Thirty Years' War":
    period: "1618-1648"
    map: {bbox: [3, 46, 22, 56], sites: [{name: Lützen, lat: 51.25, lon: 12.14}]}
    summary: >
      A war of religion and power across the Holy Roman Empire: the Catholic Emperor and the
      Catholic League against Protestant princes, joined by Denmark, then Sweden under
      Gustavus Adolphus, and finally France. It was the age of pike and shot: squares of
      pikemen with musketeers on their flanks, and cavalry that fought with pistols and
      carbines as much as swords. At Lützen, near Leipzig, on 16 November 1632 the Swedes
      beat Wallenstein's imperial army but Gustavus Adolphus was killed. A mass grave of 47
      men found there in 2011 is most likely part of the Swedish 'Blue Brigade', surprised
      in the flank by imperial cavalry; it is the source of this group's table.
    sides:
      - name: "Sweden and Protestant allies"
        who: "Swedish and Finnish troops and many German and Scottish mercenaries in Swedish pay, with Saxony and other Protestant states."
        armour: "Pikemen wore helmets and corslets when they kept them; musketeers wore none; cavalry rode in buff coats with helmets and breastplates."
        look: {colour: "#3b5a8c", trousers: "#4a4038", hat: broad_hat, beard: moustache}
      - name: "Imperial army and Catholic League"
        who: "The Emperor's army under Wallenstein and Pappenheim, Bavaria and the Catholic League, and Croat light horse."
        armour: "Cuirassiers in three-quarter plate, harquebusiers in buff coat and breastplate, pikemen in corslets; Croats and musketeers unarmoured."
        look: {colour: "#9a8a6a", trousers: "#4a4038", hat: broad_hat, beard: moustache}
    examples:
      - {name: "Blue Brigade musketeer", side: "Sweden and Protestant allies", kit: none, weapon: matchlock_musket, notes: "Matchlock and bandolier; clubs the musket in the press.", look: {hat: broad_hat}, image: {file: "Jacob de Gheyn - Wapenhandelinge 4.jpg", caption: "Musketeer from de Gheyn's Dutch drill book (1608), the drill the Swedish army adopted"}}
      - {name: "Swedish pikeman", side: "Sweden and Protestant allies", kit: pikeman_1630, weapon: spear, notes: "Pike about 5 m long.", image: {file: "The Soldier Carrying His Pike at the Slope MET DP801214.jpg", caption: "Armoured pikeman, drawing by Jacob de Gheyn II, c. 1600"}}
      - {name: "Finnish hakkapeliitta", side: "Sweden and Protestant allies", kit: harquebusier_1630, weapon: saber, notes: "Light cavalry: pistols, then swords at the gallop."}
      - {name: "Imperial cuirassier", side: "Imperial army and Catholic League", kit: cuirassier_1630, weapon: wheellock_pistol, notes: "Pappenheim's heavy horse; pistols at close range, aimed at the head.", image: {file: "Snayers Bucquoy.jpg", caption: "Imperial general Bucquoy in cuirassier's armour, by Peter Snayers"}}
      - {name: "Imperial harquebusier", side: "Imperial army and Catholic League", kit: harquebusier_1630, weapon: wheellock_pistol, notes: "Carbine and pistols; most of the balls in the Lützen grave are carbine shot.", image: {file: "Fotothek df tg 0000946 Kriegskunst ^ Pferd ^ Kavallerie ^ Reiter ^ Lanzierer ^ Kürassier ^ Arkebussierr.jpg", caption: "Lancer, cuirassier and harquebusier from Wallhausen's cavalry manual (1616)"}}
      - {name: "Croat light horseman", side: "Imperial army and Catholic League", kit: none, weapon: saber, notes: "Raiders and skirmishers."}
    sources:
      - "Nicklisch et al., PLoS ONE 12(5): e0178252 (2017): the Lützen mass grave, the Blue Brigade, and contemporary advice to aim for the head and left chest."
      - "Sides, armour and dress: general historical knowledge, not from the grave study."

  "American Revolution":
    period: "1775-1783"
    map: {bbox: [-84.5, 30.5, -65.5, 46.5], sites: [{name: Bunker Hill, lat: 42.38, lon: -71.06}, {name: Saratoga, lat: 43.00, lon: -73.63}, {name: Monmouth, lat: 40.26, lon: -74.31}, {name: Brandywine, lat: 39.88, lon: -75.58}, {name: Yorktown, lat: 37.24, lon: -76.51}, {name: Eutaw Springs, lat: 33.41, lon: -80.29}]}
    summary: >
      The thirteen colonies, joined by France from 1778 and later Spain and the Dutch
      Republic, fought Britain for independence. Battles were fought with smoothbore
      muskets and bayonets at close range, with artillery firing round shot, grape and
      canister; riflemen picked off officers from cover; dragoons fought with the sabre.
      Bayonet charges decided many fights, and some ended in killings of men trying to
      surrender, such as Paoli (1777) and Waxhaws (1780). Peckham counted 7,174 Americans
      killed and 8,241 wounded in action. The tables here are tallied from the men
      disabled for life who claimed federal invalid pensions in 1792-95.
    sides:
      - name: "Continental Army and militia"
        who: "Continental regulars, state militia, riflemen, light dragoons, and the Continental Navy and privateers."
        armour: "None. Officers wore a small gorget as a mark of rank; light dragoons wore leather helmets."
        look: {colour: "#2f3f6e", trousers: "#e8e4d8", hat: tricorne}
      - name: "British Army and Loyalists"
        who: "British regulars and marines, Loyalist provincial regiments and rangers, and the Royal Navy."
        armour: "None. Grenadiers' bearskin caps and light infantry caps gave no protection; light dragoons wore crested leather helmets."
        look: {colour: "#b3262b", trousers: "#e8e4d8", hat: tricorne}
      - name: "German auxiliaries"
        who: "Regiments hired from Hesse-Kassel, Brunswick and other German states ('Hessians'), including Jäger riflemen."
        armour: "None; grenadiers wore brass-fronted mitre caps, which were not armour."
        look: {colour: "#2f3f6e", trousers: "#e3d9a8", hat: tricorne, beard: moustache}
      - name: "French forces"
        who: "Rochambeau's expeditionary army and the French navy, from 1778; decisive at Yorktown in 1781."
        armour: "None."
        look: {colour: "#e8e4d8", trousers: "#e8e4d8", hat: tricorne}
      - name: "Native nations"
        who: "Warriors on both sides: most of the Mohawk, Seneca and Cherokee fought with Britain; the Oneida and Tuscarora with the Americans."
        armour: "None. Musket, tomahawk and knife; raids and ambushes on the frontier."
        look: {colour: "#9a7347", trousers: "#7d5530", hat: feather}
    examples:
      - {name: "Continental infantryman", side: "Continental Army and militia", kit: none, weapon: musket_smoothbore, notes: "Musket and bayonet.", image: {file: "Soldiers at the siege of Yorktown (1781), by Jean-Baptiste-Antoine DeVerger.png", caption: "American soldiers at Yorktown, 1781, watercolour by a French officer"}}
      - {name: "Morgan's rifleman", side: "Continental Army and militia", kit: none, weapon: rifle_flintlock, notes: "Long rifle, slow to load, deadly at range; no bayonet.", look: {colour: "#a99b72", trousers: "#a99b72", hat: round_hat}, image: {file: "Soldiers at the siege of Yorktown (1781), by Jean-Baptiste-Antoine DeVerger.png", caption: "American soldiers at Yorktown, 1781; the rifleman wears a hunting shirt"}}
      - {name: "Continental light dragoon", side: "Continental Army and militia", kit: dragoon_helmet, weapon: saber, notes: "Leather helmet and sabre."}
      - {name: "British grenadier", side: "British Army and Loyalists", kit: none, weapon: bayonet, notes: "The bayonet charge was the British infantry's favoured tactic.", look: {hat: bearskin}, image: {file: "David Morier (1705^-70) - Grenadiers, 16th and 17th Regiments of Foot, and Grenadier and Drummer, 18th Royal Irish Regiment of Foot, 1751 - RCIN 405583 - Royal Collection.jpg", caption: "British grenadiers by David Morier, 1751, a generation before the war"}}
      - {name: "Loyalist ranger", side: "British Army and Loyalists", kit: none, weapon: musket_smoothbore, notes: "Frontier raids alongside Native allies.", look: {colour: "#3f5a32"}}
      - {name: "British light dragoon", side: "British Army and Loyalists", kit: dragoon_helmet, weapon: saber, notes: "Tarleton's British Legion fought with sabres at Waxhaws.", image: {file: "Banastre-Tarleton-by-Joshua-Reynolds.jpg", caption: "Banastre Tarleton in light dragoon helmet, by Joshua Reynolds, 1782"}}
      - {name: "Hessian Jäger", side: "German auxiliaries", kit: none, weapon: rifle_flintlock, notes: "German hunters' rifle, short and accurate.", look: {colour: "#3f5a32", trousers: "#3f5a32"}, image: {file: "Braunschweiger Jäger.jpg", caption: "Brunswick (not Hessian) Jäger in America, watercolour by Friedrich von Germann, 1778"}}
      - {name: "Hessian musketeer", side: "German auxiliaries", kit: none, weapon: musket_smoothbore, notes: "Line infantry; musket and bayonet.", look: {hat: mitre}, image: {file: "Braunschw. Regt v. Specht. 1778.jpg", caption: "Brunswick (not Hessian) musketeer of Regiment Specht, watercolour by von Germann, 1778"}}
      - {name: "French fusilier", side: "French forces", kit: none, weapon: musket_smoothbore, notes: "Charleville musket; Yorktown 1781."}
      - {name: "Mohawk warrior", side: "Native nations", kit: none, weapon: axe, notes: "Tomahawk and musket.", image: {file: "Joseph Brant painting by George Romney 1776.jpg", caption: "Joseph Brant (Thayendanegea), Mohawk war leader, by George Romney, 1776"}}
      - {name: "Oneida scout", side: "Native nations", kit: none, weapon: musket_smoothbore, notes: "Allied with the Americans."}
    sources:
      - "Peckham, The Toll of Independence (1974), via Journal of the American Revolution, 'The 25 Deadliest Battles of the Revolutionary War' (2014): 7,174 killed and 8,241 wounded."
      - "Federal Revolutionary War Invalid Pension Claims, 1792-1795, Magazine of Early American Datasets (Penn, 2021)."
      - "Sides, alliances and dress: general historical knowledge, not from the pension data."

  "Napoleonic era & War of 1812":
    period: "1803-1815"
    map:
      - {label: Peninsular War, bbox: [-10, 35.5, 4, 44.5], sites: [{name: Salamanca, lat: 40.97, lon: -5.66}, {name: Talavera, lat: 39.96, lon: -4.83}, {name: Albuera, lat: 38.72, lon: -6.82}, {name: Zaragoza, lat: 41.65, lon: -0.88}]}
      - {label: War of 1812, bbox: [-92, 28.5, -70, 46.5], sites: [{name: Queenston Heights, lat: 43.16, lon: -79.05, context: true}, {name: Lundy's Lane, lat: 43.09, lon: -79.09, context: true}, {name: Fort Erie, lat: 42.90, lon: -78.92, context: true}, {name: River Raisin, lat: 41.91, lon: -83.40, context: true}, {name: The Thames, lat: 42.57, lon: -81.98, context: true}, {name: Bladensburg, lat: 38.94, lon: -76.94, context: true}, {name: Baltimore, lat: 39.26, lon: -76.58, context: true}, {name: New Orleans, lat: 29.94, lon: -90.05, context: true}]}
    summary: >
      France under Napoleon against shifting coalitions of Britain, Austria, Prussia,
      Russia, Spain and Portugal. In the Peninsular War (1808-1814) a British and
      Portuguese army under Wellington, with Spanish armies and guerrillas, drove the French
      out of Spain; the wound tables come from French officers' files of that war. At the
      same time (1812-1815) the United States fought Britain in North America, with the
      same weapons: smoothbore muskets and bayonets, rifles, sabres and smoothbore
      artillery. Many British regulars in the later War of 1812 were Peninsular veterans.
      No region-by-region wound count survives for the War of 1812, so it uses these
      tables.
    sides:
      - name: "French Empire and allies"
        who: "French line and light infantry, cavalry and artillery, with Polish, German and Italian allies."
        armour: "Cuirassiers and carabiniers wore steel breastplates and backplates and helmets; dragoons wore brass helmets; infantry wore none."
        look: {colour: "#2f3f6e", trousers: "#e8e4d8", hat: shako, beard: moustache}
      - name: "Britain and Peninsular allies"
        who: "Wellington's British and Portuguese army (including the 95th Rifles), Spanish regular armies and guerrillas."
        armour: "None for infantry; heavy and light dragoons wore helmets. British Household Cavalry wore cuirasses only after 1815."
        look: {colour: "#b3262b", trousers: "#6b6f75", hat: shako}
      - name: "United States (1812-15)"
        who: "US regulars, state militia (including Kentucky riflemen), US Navy and Marines."
        armour: "None; some light dragoons wore leather helmets."
        look: {colour: "#2f3f6e", trousers: "#e8e4d8", hat: shako}
      - name: "British North America (1812-15)"
        who: "British regulars, Canadian fencibles and militia, the Royal Navy, and the Provincial Marine."
        armour: "None."
        look: {colour: "#b3262b", trousers: "#6b6f75", hat: shako}
      - name: "Tecumseh's confederacy"
        who: "Shawnee, Potawatomi, Kickapoo and other nations under Tecumseh, allied with Britain until his death at the Thames (1813)."
        armour: "None. Musket, rifle, tomahawk and war club."
        look: {colour: "#9a7347", trousers: "#7d5530", hat: feather}
    examples:
      - {name: "French line infantryman", side: "French Empire and allies", kit: none, weapon: musket_smoothbore, notes: "Charleville musket and bayonet.", image: {file: "Grande Armée - Infantry.jpg", caption: "French line infantry, from Carle Vernet's La Grande Armée de 1812"}}
      - {name: "French cuirassier", side: "French Empire and allies", kit: cuirassier, weapon: saber, notes: "Heavy cavalry: straight sword, breastplate and helmet.", image: {file: "Cuirassier du 1er régiment en 1812.jpg", caption: "Cuirassier of the 1st Regiment, 1812, by Carle Vernet"}}
      - {name: "Polish lancer", side: "French Empire and allies", kit: none, weapon: lance, notes: "Vistula Legion lancers, feared at Albuera (1811).", look: {hat: czapka, trousers: "#2f3f6e"}, image: {file: "Grande Armée - Polish Light Horse Lancers.jpg", caption: "Lancers of the 7th Chevau-légers (the former Vistula Legion lancers), by Carle Vernet, 1812"}}
      - {name: "British redcoat", side: "Britain and Peninsular allies", kit: none, weapon: musket_smoothbore, notes: "Brown Bess and bayonet, firing in two-deep line.", image: {file: "Battalion Infantry 6th Regiment and 23rd (or Royal Welsh) Fusiliers.jpg", caption: "British line infantry, by Charles Hamilton Smith, 1815"}}
