  "American Civil War":
    period: "1861-1865"
    map: {bbox: [-93, 29, -72, 42], sites: [{name: Antietam, lat: 39.47, lon: -77.74}, {name: Gettysburg, lat: 39.83, lon: -77.23}, {name: Shiloh, lat: 35.15, lon: -88.32}, {name: Chickamauga, lat: 34.92, lon: -85.26}, {name: Vicksburg, lat: 32.35, lon: -90.88}]}
    summary: >
      The United States (Union) against the seceded Confederate States. Most wounds came
      from the rifle-musket firing soft lead conoidal balls, which shattered bone and led
      to the war's many amputations. Artillery, especially canister at close range, did
      the rest; sabre and bayonet wounds were rare.
    sides:
      - name: "Union"
        who: "US Regular Army and state volunteer regiments."
        armour: "None issued. In 1862 private 'bullet-proof vests' (Atwater, G&D Cook) sold by the thousand; at about 8 lb most were thrown away on the march, and wearing one was thought unmanly."
        look: {colour: "#2f3f6e", trousers: "#6f88b0", hat: kepi}
      - name: "Confederacy"
        who: "Confederate States Army and state troops."
        armour: "None issued; private vests were rarer still."
        look: {colour: "#8a8f96", trousers: "#6b6f75", hat: slouch, beard: beard}
    examples:
      - {name: "Union infantryman", side: "Union", kit: none, weapon: rifle_musket, notes: "Springfield rifle-musket, no armour.", image: {file: "Unidentified soldier in Union uniform with musket and bayonet LOC 5228555193.jpg", caption: "Unidentified Union soldier with musket and bayonet, 1861-65 (Library of Congress)"}}
      - {name: "Union volunteer with steel vest, 1862", side: "Union", kit: acw_steel_vest, weapon: rifle_musket, notes: "One of the few who kept his vest.", image: {file: "American Civil War bullet proof vest.jpg", caption: "Advertisement for the Soldiers' Bullet Proof Vest, 1862"}}
      - {name: "Confederate cavalryman", side: "Confederacy", kit: none, weapon: revolver, notes: "Revolver and sabre.", look: {hat: slouch}, image: {file: "Unidentified soldier in Confederate uniform with cavalry sword and revolver LCCN2012646164.jpg", caption: "Unidentified Confederate soldier with cavalry sword and revolver, 1861-65 (Library of Congress)"}}
      - {name: "Confederate infantryman", side: "Confederacy", kit: none, weapon: rifle_musket, notes: "Enfield or Springfield rifle-musket, no armour.", image: {file: "Unidentified soldier in Confederate uniform with musket LCCN2010650476.jpg", caption: "Unidentified Confederate soldier with musket, 1861-65 (Library of Congress)"}}
      - {name: "Union cavalryman", side: "Union", kit: none, weapon: saber, notes: "Sabre charge; carbine and revolver as well.", look: {trousers: "#6f88b0"}, image: {file: "Unidentified soldier in Union cavalry uniform holding cavalry saber LOC 5229167420.jpg", caption: "Unidentified Union cavalryman with sabre, 1861-65 (Library of Congress)"}}
    sources:
      - "Antietam on the Web, 'Saved by his steel vest' (2018): Atwater and G&D Cook vests, sales and use."

  "American Indian Wars":
    period: "1862-1871 (arrow reports)"
    map: {bbox: [-118, 28, -94, 49], sites: [{name: Fort Phil Kearny, lat: 44.53, lon: -106.83}, {name: Fort Buford, lat: 47.99, lon: -104.04}, {name: Fort Garland, lat: 37.43, lon: -105.43}, {name: Fort Dodge, lat: 37.73, lon: -99.94}, {name: Fort Concho, lat: 31.45, lon: -100.43}, {name: Camp Verde, lat: 34.56, lon: -111.85}]}
    summary: >
      After the Civil War the US Army garrisoned the Plains and the Southwest and fought a
      long series of campaigns against the nations whose land the railways and settlers
      were entering: on the Plains the Lakota (Sioux), Cheyenne, Arapaho, Kiowa and Comanche;
      in Arizona, New Mexico and Texas the Apache, Navajo and Lipan. Most fights were raids,
      ambushes of herders, mail escorts and wagon trains, and skirmishes between small
      parties. Warriors used firearms when they could get them; younger and poorer men
      still fought with the bow, which in skilled hands loosed several arrows in the time a
      soldier reloaded. The Army's surgeons wrote up 83 arrow cases from 1865-71; the table
      here is tallied from them.
    sides:
      - name: "US Army"
        who: "Regular cavalry and infantry posted to frontier forts, with Indian scouts and civilian herders, teamsters and settlers."
        armour: "None. Wool uniform; the cavalry fought mounted or dismounted with carbine, revolver and sabre."
        look: {colour: "#2f3f6e", trousers: "#6f88b0", hat: slouch, beard: moustache}
      - name: "Plains and Southwest nations"
        who: "Lakota, Cheyenne, Arapaho, Kiowa, Comanche, Apache, Navajo and Lipan warriors, in raiding and war parties."
        armour: "None worn. Many warriors carried a round shield of thick rawhide (buffalo hide on the Plains), which could turn an arrow or a glancing ball."
        look: {colour: "#9a7347", trousers: "#7d5530", hat: feather}
    examples:
      - {name: "Plains warrior with bow", side: "Plains and Southwest nations", kit: rawhide_shield, weapon: bow, notes: "Iron trade-hoop or flint arrowheads; several arrows in quick succession.", image: {file: "White Bear (Sa-tan-ta), a Kiowa chief, full-length, seated, holding bow and arrows, 1869 - 1874 - NARA - 518901.jpg", caption: "Satanta (White Bear), Kiowa war leader, with bow and arrows, photographed by William S. Soule, 1869-74"}}
      - {name: "Comanche lancer", side: "Plains and Southwest nations", kit: rawhide_shield, weapon: spear, notes: "Mounted with lance and shield.", image: {file: "Comanche Osage fight.jpg", caption: "A Comanche lances an Osage at full gallop, painted by George Catlin, 1834"}}
      - {name: "Apache raider", side: "Plains and Southwest nations", kit: none, weapon: bow, notes: "Ambush from cover; hoop-iron arrowheads.", look: {colour: "#e8e4d8", trousers: "#9a7347", hat: headband}}
      - {name: "US cavalry trooper", side: "US Army", kit: none, weapon: revolver, elsewhere: true, notes: "No arrow-era gunshot table exists; his revolver rolls on a Civil War table.", image: {file: "Unidentified Buffalo soldier, 10th Cavalry, United States Army (5431234784).jpg", caption: "Trooper of the 10th Cavalry (Buffalo Soldiers), c. 1870"}}
      - {name: "US infantryman", side: "US Army", kit: none, weapon: rifle_musket, elsewhere: true, notes: "Springfield rifle (rolls on a Civil War table)."}
      - {name: "Indian scout", side: "US Army", kit: none, weapon: bow, notes: "Several scouts in the reports were themselves hit by arrows.", look: {colour: "#2f3f6e", trousers: "#7d5530", hat: headband}, image: {file: "Apache Scouts.jpg", caption: "Apache scouts at Fort Apache, Arizona Territory, c. 1880"}}
    sources:
      - "US Surgeon General's Office, Circular No. 3 (1871), 'Arrow-Wounds', pp. 144-161 (archive.org: reportofsurgical00unituoft). Places, tribes, units and the note on firearms and bows are from the case reports and Dr. Muller's note there."
      - "Rawhide shields: general ethnographic description, not from the report."

  "WWI":
    period: "1914-1918"
    map: {bbox: [-3, 38, 30, 54], sites: [{name: Ypres, lat: 50.85, lon: 2.88}, {name: Somme, lat: 50.00, lon: 2.70}, {name: Verdun, lat: 49.16, lon: 5.38}, {name: Isonzo, lat: 46.00, lon: 13.60}, {name: Gallipoli, lat: 40.24, lon: 26.28}]}
    summary: >
      The Allied powers (France, the British Empire, Russia, Italy, and from 1917 the
      United States) against the Central Powers (Germany, Austria-Hungary, the Ottoman
      Empire and Bulgaria). Trench warfare made artillery the main killer and the head
      the most exposed target, which drove the return of the steel helmet.
    sides:
      - name: "Allies"
        who: "French, British Empire, Russian, Italian and American armies."
        armour: "Cloth caps and kepis in 1914. Steel helmets from 1915-16: the French Adrian, then the British Brodie. A little private-purchase body armour; Italian assault engineers used heavy plate."
        look: {colour: "#7a6e48", hat: field_cap, helmet: brodie, beard: moustache}
      - name: "Central Powers"
        who: "German, Austro-Hungarian, Ottoman and Bulgarian armies."
        armour: "German Stahlhelm from 1916. Heavy Sappenpanzer breastplates for sentries and machine gunners in fixed positions."
        look: {colour: "#6f7569", hat: field_cap, helmet: stahlhelm, beard: moustache}
    examples:
      - {name: "French poilu, 1914", side: "Allies", kit: none, weapon: rifle_service, notes: "Kepi, no helmet yet.", look: {colour: "#3f4f7a", trousers: "#a3262b", hat: kepi}, image: {file: "Portrait de soldats du 20e régiment d'infanterie territoriale, août 1914.jpg", caption: "French territorial infantry in kepis, August 1914"}}
      - {name: "British infantryman, 1916", side: "Allies", kit: ww2_rifleman, weapon: rifle_service, notes: "Brodie helmet, Lee-Enfield.", image: {file: "Cheshire Regiment trench Somme 1916.jpg", caption: "Cheshire Regiment in a captured German trench on the Somme, July 1916"}}
      - {name: "German machine gunner", side: "Central Powers", kit: ww1_sentry, weapon: machine_gun, notes: "Stahlhelm and Sappenpanzer in a fixed position.", image: {file: "Maschinengewehrkompanie.jpg", caption: "German machine-gun company (MGK III, Infantry Regiment 401), 1918"}}
      - {name: "Trench raider, 1917", side: "Allies", kit: ww2_rifleman, weapon: entrenching_tool, notes: "Night raid: sharpened spade, revolver and grenades; no rifle in the trench.", image: {file: "A raiding party from the 9th Battalion, Scottish Rifles (Cameronians), leaving a sap and making for the German lines, 11 April 1917. Q5101.jpg", caption: "Raiding party of the 9th Cameronians leaving a sap for the German lines, April 1917"}}
      - {name: "Russian infantryman, 1915", side: "Allies", kit: none, weapon: bayonet, notes: "Most Russian soldiers had no steel helmet; the army set great store by the bayonet.", look: {colour: "#8a8458", hat: field_cap}, image: {file: "Russian infantry LCCN2014697563.jpg", caption: "Russian infantry, 1914 (Library of Congress)"}}
      - {name: "Italian Ardito, 1918", side: "Allies", kit: ww2_rifleman, weapon: hand_grenade, notes: "Assault trooper: Adrian helmet, grenades and dagger.", look: {colour: "#6f7560", helmet: adrian}, image: {file: "Italian Arditi.jpg", caption: "Italian Arditi assault troops, c. 1918"}}
      - {name: "American doughboy, 1918", side: "Allies", kit: ww2_rifleman, weapon: rifle_service, notes: "M1917 (Brodie-pattern) helmet, Springfield rifle.", look: {colour: "#6f6a48"}, image: {file: "At close grips2.jpg", caption: "American soldiers bombing a position, c. 1917-18 (Library of Congress)"}}
      - {name: "German stormtrooper, 1918", side: "Central Powers", kit: ww2_rifleman, weapon: hand_grenade, notes: "Stahlhelm; grenades, carbine and sharpened spade.", image: {file: "Bundesarchiv Bild 146-1974-132-26A, Stoßtrupp.jpg", caption: "German Stoßtruppen leaving a trench to attack, 1917-18 (Bundesarchiv)"}}
      - {name: "Austro-Hungarian infantryman", side: "Central Powers", kit: ww2_rifleman, weapon: rifle_service, notes: "Steel helmet from 1916-17; Mannlicher rifle.", look: {colour: "#7f8a8c"}, image: {file: "Handgranatenwerfer an der isonzofront 10. september 1917.jpg", caption: "Austro-Hungarian soldiers in steel helmets on the Isonzo front, September 1917"}}
      - {name: "Ottoman infantryman, Gallipoli", side: "Central Powers", kit: none, weapon: rifle_service, notes: "Cloth headgear, no steel helmet; Mauser rifle.", look: {colour: "#8a7a52", hat: kabalak}, image: {file: "Turkish Infantry Column at rest (LOC).jpg", caption: "Ottoman infantry column at rest, c. 1915 (Library of Congress)"}}
      - {name: "Bulgarian infantryman", side: "Central Powers", kit: none, weapon: rifle_service, notes: "Mostly without steel helmets; Mannlicher rifle.", look: {colour: "#6f6a50", hat: field_cap}, image: {file: "Miletkovo 1917 Bulgarian Soldiers Resting.jpg", caption: "Bulgarian soldiers resting at Miletkovo on the Macedonian front, 1916-18"}}
    sources:
      - "Military Wiki, 'Stahlhelm' (introduction of German and Allied steel helmets)."

  "WWII":
    period: "1939-1945 (Bougainville 1943-45; Italy 1943-45)"
    map: {bbox: [-10, -20, 170, 60], sites: [{name: Italy (Cassino), lat: 41.49, lon: 13.81}, {name: Bougainville, lat: -6.20, lon: 155.40}]}
    summary: >
      The Allies against the Axis. This group's tables come from two theatres: the
      jungle campaign on Bougainville in the Solomon Islands (US Marines and Army against
      the Imperial Japanese Army) and the Italian campaign (US, British and Commonwealth
      forces against the German army). Mortars and artillery caused half of the
      Bougainville wounds.
    sides:
      - name: "Allies"
        who: "US Army and Marine Corps; British and Commonwealth armies in Italy; the Australian army, which took over Bougainville from late 1944."
        armour: "Steel helmets (M1, Brodie) for all infantry, no body armour. Bomber crews wore steel-plate flak vests from 1943."
        look: {colour: "#5d6449", helmet: m1}
      - name: "Axis"
        who: "Imperial Japanese Army; German Wehrmacht."
        armour: "Steel helmets (Japanese Type 90, German Stahlhelm); no infantry body armour."
        look: {colour: "#6f7569", helmet: stahlhelm}
    examples:
      - {name: "US Marine, Bougainville", side: "Allies", kit: ww2_rifleman, weapon: rifle_service, notes: "M1 helmet, M1 Garand.", image: {file: "1st Battalion 3rd Marines on Bougainville.png", caption: "1st Battalion, 3rd Marines coming out of the jungle on Bougainville, November 1943"}}
      - {name: "Japanese infantryman", side: "Axis", kit: ww2_rifleman, weapon: hand_grenade, notes: "Type 90 helmet; grenades and knee mortars at close range.", look: {colour: "#7d7448", helmet: japanese}, image: {file: "Imperial Japanese Army Infantry 111th Regiment soldier and Indian National Army soldier.jpg", caption: "Japanese infantry of the 111th Regiment in Burma, 1943"}}
      - {name: "German MG gunner, Italy", side: "Axis", kit: ww2_rifleman, weapon: machine_gun, notes: "Stahlhelm, MG 42.", image: {file: "Bundesarchiv Bild 101I-316-1172-06, Italien, Gebirgsjäger mit schwerem MG 42.jpg", caption: "German mountain troops with an MG 42 in Italy, 1944 (Bundesarchiv)"}}
      - {name: "US bomber waist gunner", side: "Allies", kit: aircrew_flak, weapon: machine_gun, notes: "Flak vest and helmet; not an infantry kit.", image: {file: "B-17 waist gunner LCCN2004661756.jpg", caption: "B-17 waist gunner, wartime drawing, 1942 (Library of Congress)"}}
      - {name: "British infantryman, Italy", side: "Allies", kit: ww2_rifleman, weapon: rifle_service, notes: "Brodie helmet, Lee-Enfield; Eighth Army.", look: {colour: "#7a6e48", helmet: brodie}, image: {file: "The British Army in Italy, April 1944 TR1708.jpg", caption: "Corporal of the Duke of Cornwall's Light Infantry in Italy, April 1944"}}
      - {name: "Australian infantryman, Bougainville 1945", side: "Allies", kit: none, weapon: pistol_smg, notes: "Often a slouch hat rather than a helmet in the jungle; Owen submachine gun.", look: {colour: "#5d6449", hat: slouch}, image: {file: "AWM 078546 Australian 42nd Battalion patrol on Bougainville.jpg", caption: "Australian 42nd Battalion patrol on Bougainville, January 1945"}}
      - {name: "German paratrooper, Cassino", side: "Axis", kit: ww2_rifleman, weapon: pistol_smg, notes: "Rimless paratrooper helmet, MP 40; fought as infantry.", look: {helmet: fj}, image: {file: "Bundesarchiv Bild 146-1974-006-62, Bei Monte Cassino, Fallschirmjäger.jpg", caption: "German paratrooper near Monte Cassino, February 1944 (Bundesarchiv)"}}
    sources:
      - "Borden Institute, Weapons Effects and War Wounds, Table 1-1 (Bougainville causes of injury)."

  "Korea":
    period: "1950-1953"
    map: {bbox: [124, 33, 131, 43], borders: true, highlight: [North Korea, South Korea], sites: [{name: Pusan, lat: 35.10, lon: 129.04}, {name: Seoul, lat: 37.57, lon: 126.98}, {name: Imjin River, lat: 37.95, lon: 126.90}, {name: Chosin Reservoir, lat: 40.47, lon: 127.30}]}
    summary: >
      The United Nations Command, led by the United States with South Korea, the British
      Commonwealth and others, against North Korea and, from late 1950, the Chinese
      People's Volunteer Army. Fighting swung from mobile war to static trench lines,
      where body armour first came into general use.
    sides:
      - name: "UN Command"
        who: "US, South Korean, British Commonwealth and other UN forces."
        armour: "Steel helmets. The US Marines fielded the M1951 vest with Doron plates; the Army's nylon M-1952 reached front-line troops in late 1952, in small numbers."
        look: {colour: "#5d6449", helmet: m1}
      - name: "North Korea and China"
        who: "Korean People's Army; Chinese People's Volunteer Army."
        armour: "No body armour; many Chinese soldiers had no steel helmet."
        look: {colour: "#7a7448", hat: field_cap}
    examples:
      - {name: "US Army rifleman, 1950", side: "UN Command", kit: ww2_rifleman, weapon: rifle_service, notes: "M1 helmet, no vest.", image: {file: "U.S. Army machine gun team near the Chongchon River in North Korea (November 1950).jpg", caption: "US Army machine-gun team near the Chongchon River, November 1950"}}
      - {name: "US Marine, 1952", side: "UN Command", kit: vietnam_usmc, weapon: rifle_service, notes: "M1951 Doron vest.", image: {file: "Body armor vest in Korea (KWB 53-2511-171), National Museum of Health and Medicine (3299287269).jpg", caption: "American soldier in an armoured vest, Korea (Army wound-ballistics survey photo, 1953)"}}
      - {name: "South Korean infantryman", side: "UN Command", kit: ww2_rifleman, weapon: rifle_service, notes: "ROK Army: M1 helmet, M1 Garand.", image: {file: "SC 348651 - ROK squad, led by American soldiers, search for North Korean enemy snipers near Yongsan. 16 September, 1950. (52514534466).jpg", caption: "ROK Army squad searching for snipers near Yongsan, September 1950"}}
      - {name: "British infantryman, Imjin 1951", side: "UN Command", kit: ww2_rifleman, weapon: rifle_service, notes: "Commonwealth brigade: steel helmet, Lee-Enfield.", look: {colour: "#7a6e48", helmet: brodie}, image: {file: "Indian, British, New Zealand and Australian soldiers in Korea 1951.jpg", caption: "Indian, British, New Zealand and Australian soldiers in Korea, March 1951"}}
      - {name: "North Korean infantryman, 1950", side: "North Korea and China", kit: none, weapon: rifle_service, notes: "Korean People's Army: Soviet-pattern kit, often no steel helmet; Mosin rifle or PPSh."}
      - {name: "Chinese infantryman", side: "North Korea and China", kit: none, weapon: pistol_smg, notes: "Quilted uniform, PPSh submachine gun, grenades.", look: {colour: "#8a8a6a", hat: winter_cap}, image: {file: "P46 b.jpg", caption: "Chinese People's Volunteers taking an oath before the Chosin Reservoir battle, November 1950"}}
    sources:
      - "Wikipedia, 'M-1952 Flak Jacket'."

  "Vietnam":
    period: "1965-1973 (major US involvement)"
    map: {bbox: [100, 8, 112, 24], borders: true, highlight: [Vietnam], sites: [{name: Khe Sanh, lat: 16.65, lon: 106.73}, {name: Hue, lat: 16.46, lon: 107.59}, {name: Ia Drang, lat: 13.60, lon: 107.70}, {name: Saigon, lat: 10.82, lon: 106.63}]}
    summary: >
      South Vietnam, the United States and allies (Australia, New Zealand, South Korea,
      Thailand) against North Vietnam's army (PAVN) and the southern Viet Cong. Most
      wounds came from fragments; mines and booby traps caused 15% of wounds and punji
      stakes 2%, while bullets killed far more often than they wounded.
    sides:
      - name: "US and allies"
        who: "South Vietnamese army (ARVN), US Army and Marine Corps, and Australian, New Zealand, South Korean and Thai contingents."
        armour: "M1 steel helmet; Army M69 nylon vest, Marine M1955 vest with Doron plates. Both stopped fragments, not AK rounds, and in the heat they were often left behind on patrol."
        look: {colour: "#4f5a3a", helmet: m1, beard: stubble}
      - name: "PAVN and Viet Cong"
        who: "People's Army of Vietnam regulars; Viet Cong guerrillas."
        armour: "None. The PAVN pith helmet gave no ballistic protection. They relied on concealment, mines and booby traps."
        look: {colour: "#5f6b3a", hat: pith}
    examples:
      - {name: "US Army infantryman, 1968", side: "US and allies", kit: vietnam_army, weapon: rifle_assault, notes: "M1 helmet, M69 vest, M16.", image: {file: "1st Battalion, 18th Infantry soldiers search Mac Dinh Chi Cemetery for Viet Cong snipers.jpg", caption: "1st Battalion, 18th Infantry search a Saigon cemetery for snipers, February 1968"}}
      - {name: "US Marine, Hue 1968", side: "US and allies", kit: vietnam_usmc, weapon: rifle_assault, notes: "M1955 vest, urban fighting.", image: {file: "US Marines move through streets of Hue, Vietnam (1968).jpg", caption: "US Marines move through the streets of Hue, February 1968"}}
      - {name: "ARVN infantryman", side: "US and allies", kit: ww2_rifleman, weapon: rifle_assault, notes: "South Vietnamese army: M1 helmet, usually no vest; M16 from 1968, carbines before.", image: {file: "ARVN 7th Battalion, 1st Airborne Division soldier takes up position near the wall of the French National Cemetery.jpg", caption: "ARVN airborne soldier in Saigon during the May 1968 offensive"}}
      - {name: "Australian infantryman, 1968", side: "US and allies", kit: none, weapon: rifle_assault, notes: "Bush hat, no body armour; L1A1 SLR.", look: {colour: "#4f5a3a", hat: boonie}, image: {file: "4 RAR soldier armed with a M60 in South Vietnam during August 1968.jpg", caption: "4 RAR soldier with an M60 in Phuoc Tuy Province, August 1968"}}
      - {name: "South Korean marine", side: "US and allies", kit: ww2_rifleman, weapon: rifle_assault, notes: "ROK Marine Corps: M1 helmet.", image: {file: "ROK Outpost, South of Chu Lai, circa 1966 (49716380807).jpg", caption: "Republic of Korea Marine outpost south of Chu Lai, c. 1966"}}
      - {name: "PAVN regular", side: "PAVN and Viet Cong", kit: none, weapon: rifle_assault, notes: "Pith helmet, AK-47."}
      - {name: "Viet Cong guerrilla", side: "PAVN and Viet Cong", kit: none, weapon: mine_ied, notes: "Booby traps, mines and punji pits.", look: {colour: "#2b2b2b", trousers: "#2b2b2b", hat: none}}
    sources:
      - "Neel, Medical Support of the U.S. Army in Vietnam (1973), ch. 3, Table 6."
      - "Wikipedia, 'Flak jacket' (M69 and M1955 protection)."

  "Late 20th century":
    period: "1969-1996"
    map: {bbox: [-80, -55, 60, 62], sites: [{name: Belfast, lat: 54.60, lon: -5.93}, {name: Falklands, lat: -51.70, lon: -57.86}, {name: Kuwait, lat: 29.37, lon: 47.98}, {name: Mogadishu, lat: 2.05, lon: 45.32}, {name: Grozny, lat: 43.32, lon: 45.69}]}
    summary: >
      Six smaller wars with very different fighting. Northern Ireland (1969-98): the
      British Army and police against the Provisional IRA, mostly sniping and bombs.
      The Falklands (1982): Britain against Argentina, infantry fighting over open
      hills. The Gulf War (1991): a US-led coalition against Iraq. Somalia (1993): US
      Rangers and special forces against Somali militia in Mogadishu. Chechnya (1994-96
      and later): Russia against Chechen separatists, with urban battles in Grozny.
    sides:
      - name: "Northern Ireland"
        who: "British Army and RUC; Provisional IRA and other paramilitaries."
        armour: "British patrols wore helmets and soft body armour; the IRA wore none and used rifles, snipers and bombs."
        look: {colour: "#6b6a4a"}
      - name: "Falklands 1982"
        who: "British paratroopers, Royal Marines and infantry; Argentine conscripts and marines."
        armour: "Steel helmets on both sides; little body armour."
        look: {colour: "#6b6a4a", helmet: brodie}
      - name: "Gulf War 1991"
        who: "US-led coalition; Iraqi army."
        armour: "US troops in PASGT Kevlar helmets and vests (fragments and pistol rounds); Iraqi troops in steel helmets."
        look: {colour: "#c2ab7a"}
      - name: "Somalia 1993"
        who: "US Task Force Ranger; Somali National Alliance militia."
        armour: "Rangers wore IIIA soft vests with a single ceramic front plate and no back plate; militia were unarmoured, with AKs and RPGs."
        look: {colour: "#a99b72"}
      - name: "Chechnya"
        who: "Russian army and interior troops; Chechen separatist fighters."
        armour: "Russian helmets and body armour, unevenly issued; Chechen fighters largely unarmoured."
        look: {colour: "#5f6b3a", helmet: soviet}
    examples:
      - {name: "British soldier, Belfast", side: "Northern Ireland", kit: pasgt, weapon: rifle_assault, notes: "Soft body armour and helmet (PASGT used as the nearest kit).", look: {helmet: pasgt, hat: beret}}
      - {name: "IRA sniper", side: "Northern Ireland", kit: none, weapon: rifle_assault, notes: "Armalite, no armour.", look: {colour: "#3a3a3a", trousers: "#2f3540", hat: balaclava}}
      - {name: "British Guardsman, Tumbledown", side: "Falklands 1982", kit: ww2_rifleman, weapon: bayonet, notes: "Steel helmet; the final assaults on the mountains ended with the bayonet."}
      - {name: "Argentine conscript", side: "Falklands 1982", kit: ww2_rifleman, weapon: rifle_assault, notes: "Steel helmet, FN FAL.", look: {colour: "#5d6449", helmet: m1}, image: {file: "Soldadosargentinos3.jpg", caption: "Argentine soldiers with FN FAL rifles on the Falklands, May 1982"}}
      - {name: "US soldier, Desert Storm", side: "Gulf War 1991", kit: pasgt, weapon: rifle_assault, notes: "PASGT helmet and vest, M16.", look: {helmet: pasgt}, image: {file: "DA-ST-92-07911.jpg", caption: "Soldiers of the 327th Infantry, 101st Airborne Division, March 1991"}}
      - {name: "British soldier, Desert Storm", side: "Gulf War 1991", kit: pasgt, weapon: rifle_assault, notes: "Soft body armour and helmet (PASGT used as the nearest kit).", image: {file: "British soldier with L85.jpg", caption: "1st Staffordshire Regiment soldier with an L85 on live-fire training, January 1991"}}
      - {name: "Iraqi conscript", side: "Gulf War 1991", kit: ww2_rifleman, weapon: rifle_assault, notes: "Steel helmet, AK-47.", look: {colour: "#6b6a4a", helmet: m1}, image: {file: "Iraqi soldiers in Kuwait, 1990.png", caption: "Iraqi soldiers in Kuwait, 1990"}}
      - {name: "US Ranger, Mogadishu", side: "Somalia 1993", kit: ranger_1993, weapon: rifle_assault, notes: "Front plate only.", image: {file: "Black Hawk Down Rangers under fire October 3, 1993.jpg", caption: "Task Force Ranger under fire in Mogadishu, 3 October 1993"}}
      - {name: "Somali militiaman", side: "Somalia 1993", kit: none, weapon: rpg, notes: "No armour; AK-47 and RPG-7.", look: {colour: "#d8d0b8", trousers: "#4a4f55", hat: none}}
      - {name: "Russian conscript, Grozny 1995", side: "Chechnya", kit: ww2_rifleman, weapon: rifle_assault, notes: "Steel helmet; body armour often missing.", look: {helmet: soviet}}
      - {name: "Chechen fighter, Grozny", side: "Chechnya", kit: none, weapon: rpg, notes: "Urban ambush teams.", look: {colour: "#3f4a3a", hat: none, beard: beard}, image: {file: "Evstafiev-chechnya-palace-gunman.jpg", caption: "Chechen fighter near the Presidential Palace in Grozny, January 1995 (Mikhail Evstafiev)"}}
    sources:
      - "Wikipedia, 'Ranger Body Armor' (front plate only in 1993)."
      - "Borden Institute, Weapons Effects and War Wounds, Table 1-2 (wound distributions)."

  "Iraq & Afghanistan":
    period: "2001-2021"
    map: {bbox: [37, 24, 73, 39.5], borders: true, highlight: [Iraq, Afghanistan], sites: [{name: Baghdad, lat: 33.31, lon: 44.37}, {name: Fallujah, lat: 33.35, lon: 43.78}, {name: Helmand, lat: 31.58, lon: 64.37}, {name: Kandahar, lat: 31.61, lon: 65.71}]}
    summary: >
      US-led coalitions in Afghanistan from 2001 (against the Taliban and al-Qaeda) and
      in Iraq from 2003 (against the Iraqi army, then insurgents and militias). Roadside
      bombs became the main weapon against coalition troops, and modern body armour
      moved wounds from the torso to the head, face and limbs.
    sides:
      - name: "Coalition"
        who: "US, British and other allied forces; the Afghan and new Iraqi security forces they trained."
        armour: "Interceptor vests with SAPI rifle plates and Kevlar helmets from the start of the Iraq war; ESAPI plates against armour-piercing rounds by the mid-2000s; lighter plate carriers later, especially in Afghanistan."
        look: {colour: "#a69a74", beard: stubble}
      - name: "Iraqi army, 2003"
        who: "Iraqi regular army and Republican Guard during the invasion."
        armour: "Steel helmets for some; little body armour."
        look: {colour: "#6b6a4a"}
      - name: "Insurgents and Taliban"
        who: "Iraqi insurgents and militias; Taliban fighters."
        armour: "Largely unarmoured. IEDs, RPGs, rifles and mortars."
        look: {colour: "#d8d0b8", trousers: "#cfc6ae", hat: turban, beard: beard}
    examples:
      - {name: "US soldier, Iraq 2004", side: "Coalition", kit: interceptor, weapon: rifle_assault, notes: "Interceptor vest, SAPI plates, ACH.", image: {file: "A CO 1-18IN 2BDE 1ID on patrol Iraq Nov 2004.jpg", caption: "1st Infantry Division soldiers on patrol in Iraq, November 2004"}}
      - {name: "US soldier, Afghanistan 2011", side: "Coalition", kit: plate_carrier, weapon: rifle_assault, notes: "Plate carrier with ESAPI.", image: {file: "Defense.gov News Photo 110131-A-9563P-045 - U.S. Army Spc. Nicholas Francioso crosses a small irrigation canal during a patrol in the Arghandab district in Afghanistan s Kandahar province on.jpg", caption: "US Army patrol in the Arghandab district, Kandahar, January 2011"}}
      - {name: "British soldier, Helmand 2009", side: "Coalition", kit: interceptor, weapon: rifle_assault, notes: "Osprey vest with plates (Interceptor used as the nearest kit).", look: {colour: "#a39573"}, image: {file: "Soldier with 1 Welsh Guards Returns from a Patrol in Afghanistan MOD 45153403.jpg", caption: "1st Welsh Guards soldier returning from patrol in Helmand, May 2009"}}
      - {name: "Afghan National Army soldier", side: "Coalition", kit: pasgt, weapon: rifle_assault, notes: "Helmet and vest when issued (PASGT used as the nearest kit).", look: {colour: "#6b6a4a", helmet: pasgt}, image: {file: "Afghan National Army Soldier MOD 45152324.jpg", caption: "Afghan National Army soldier, December 2010"}}
      - {name: "Iraqi soldier, 2003", side: "Iraqi army, 2003", kit: ww2_rifleman, weapon: rifle_assault, notes: "Steel helmet, AK-47.", look: {helmet: m1}}
      - {name: "Insurgent, Iraq", side: "Insurgents and Taliban", kit: none, weapon: mine_ied, notes: "Roadside bombs.", look: {hat: shemagh}}
      - {name: "Taliban fighter", side: "Insurgents and Taliban", kit: none, weapon: rifle_assault, notes: "AK-47, no armour."}
    sources:
      - "Owens et al., J Trauma 2008; Borden Institute, Table 1-1 (DoD Trauma Registry 2007-17)."

  "Reference":
    period: ""
    summary: >
      Not a war. The random-hit table shows where hits would land if every square inch
      of the body were equally likely: use it as a neutral table with any armour, or to
      see how far a real war's pattern moves away from chance. Below it, the four-war
      comparison shows how American wound patterns changed from WWII to Iraq and
      Afghanistan, counted the same way each time; each of those four tables is listed
      under its own war as the Owens comparison set.
    sides: []
    examples:
      - {name: "Modern soldier", side: "-", kit: plate_carrier, weapon: rifle_assault, notes: "Plate carrier and helmet.", look: {colour: "#a69a74"}}
      - {name: "Police officer", side: "-", kit: police_iiia, weapon: pistol_smg, notes: "Concealable IIIA vest.", look: {colour: "#1d2433", trousers: "#1d2433", hat: police_cap}}
      - {name: "Civilian", side: "-", kit: none, weapon: pistol_smg, notes: "No armour.", look: {colour: "#5a6b7a", trousers: "#3a4250"}}
    comparison:
      title: "US wars compared: where hospitalized wounded were hit"
      note: >
        Same source and counting rule for every row: hospitalized casualties, including
        men who later died of wounds. With modern body armour the thorax share fell to
        6% and the head and neck rose to 30%, because plates cover the chest and nothing
        covers the face and neck. Gunshot vs explosion shows how the weapon mix shifted.
      columns: ["Head & neck", "Thorax", "Abdomen", "Extremities", "Gunshot / explosion"]
      rows:
        - ["Body surface area (chance)", "12%", "16%", "11%", "61%", "-"]
        - ["WWII", "21%", "14%", "8%", "58%", "27 / 73"]
        - ["Korea", "21%", "10%", "9%", "60%", "31 / 69"]
        - ["Vietnam", "16%", "13%", "10%", "61%", "35 / 65"]
        - ["Iraq & Afghanistan", "30%", "6%", "9%", "55%", "19 / 81"]
      source: "Owens et al., 'Combat wounds in Operation Iraqi Freedom and Operation Enduring Freedom', J Trauma 2008 (National Academies 2014, Tables 3-2 and 3-4)."
    sources: []

  "Close combat":
    period: "Stockholm, 1983-1993"
    map: {bbox: [10, 55, 25, 63], sites: [{name: Stockholm, lat: 59.33, lon: 18.07}]}
    summary: >
      Knife killings recorded by forensic pathologists: usually one attacker against an
      unarmoured, often surprised victim, with several wounds each. The table stands in
      for knives and bayonets on every non-medieval table.
    sides:
      - name: "Attacker"
        who: "Single assailant with a knife."
        armour: "None."
        look: {colour: "#3a3a3a", trousers: "#2f3540"}
      - name: "Victim"
        who: "Usually unarmoured civilians; 41% had defensive wounds on the hands and arms."
        armour: "None. Soft ballistic vests give little protection against a stab; plates stop one."
        look: {colour: "#5a6b7a", trousers: "#3a4250"}
    examples:
      - {name: "Knife attacker", side: "Attacker", kit: none, weapon: dagger, notes: "Single assailant."}
      - {name: "Police officer", side: "Victim", kit: police_iiia, weapon: dagger, notes: "IIIA vest: stops bullets, not knives.", look: {colour: "#1d2433", trousers: "#1d2433", hat: police_cap}}
      - {name: "Soldier in plates", side: "Victim", kit: plate_carrier, weapon: bayonet, notes: "Plates stop most stabs to the chest.", look: {colour: "#a69a74"}}
      - {name: "Civilian", side: "Victim", kit: none, weapon: dagger, notes: "No armour."}
    sources:
      - "Karlsson 1998, via forensicmed.co.uk."

