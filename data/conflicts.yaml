# Conflict background, keyed by each table's `battle` group.
# sides    - who fought and how each side used armour (prose; facts as sourced)
# examples - ready-made combatants: an armour kit (armor.yaml) and a typical weapon
#            (weapons.yaml) for that side. The kit is what they wear as a TARGET;
#            the weapon is what they use when they ATTACK.
# look     - how the example figures are drawn (templates/figure.js), on a side or an example
#            (an example's look is merged over its side's): colour, trousers, coat: skin,
#            hat (when the kit has no helmet), helmet (shape, when it has one), beard
#            elsewhere: true - the weapon is recorded only in another group's tables (no
#            data for it in this war); the roller offers to switch tables when he attacks.

conflicts:
  "Visby 1361":
    period: "27 July 1361"
    summary: >
      King Valdemar IV Atterdag of Denmark invaded Gotland, then a rich trading island,
      and met its rural defenders outside the walls of Visby. The Gotlanders were a
      peasant levy facing professional troops, and the fight became a slaughter. The
      dead were buried quickly in mass graves, many still in their armour, which is why
      Visby gives the best picture of medieval battle wounds: 1,185 skeletons were
      recovered from three graves.
    sides:
      - name: "Danish army"
        who: "Professional soldiers of Valdemar IV."
        armour: "Mail, coats of plates and plate helmets; the best-equipped wore gauntlets and leg harness. Few of their dead are in the graves."
        look: {colour: "#8e2b2b", beard: beard}
      - name: "Gotlandic levy"
        who: "Farmers and freeholders of rural Gotland, called out to defend the island."
        armour: "Uneven. Many wore mail coifs and padded coats; some had coats of plates and gauntlets; many had little or nothing on the legs, which took most of the blade wounds."
        look: {colour: "#8a7a5c", trousers: "#6b5d45", hat: hood, beard: beard}
    examples:
      - {name: "Gotland levy", side: "Gotlandic levy", kit: gotland_levy, weapon: spear, notes: "Coif and padded coat; legs bare."}
      - {name: "Gotland freeholder", side: "Gotlandic levy", kit: gotland_armoured, weapon: axe, notes: "Wealthier farmer in a coat of plates."}
      - {name: "Danish man-at-arms", side: "Danish army", kit: danish_maa, weapon: sword, notes: "Fully harnessed professional."}
      - {name: "Danish sergeant", side: "Danish army", kit: transitional, weapon: spiked_club, notes: "Coat of plates and mail; the spiked club matches square holes in Visby skulls."}
      - {name: "Danish crossbowman", side: "Danish army", kit: transitional, weapon: crossbow, notes: "126 arrow and bolt wounds were found among the Gotland dead."}
    sources:
      - "Swedish History Museum, 'Skull from the Battle of Visby'."
      - "Medievalists.net, 'Medieval battle injuries' (2024), summarising Ingelmark in Thordeman (1939)."

  "Thirty Years' War":
    period: "1618-1648"
    summary: >
      A war of religion and power across the Holy Roman Empire: the Catholic Emperor and the
      Catholic League against Protestant princes, joined by Denmark, then Sweden under
      Gustavus Adolphus, and finally France. It was the age of pike and shot: squares of
      pikemen with musketeers on their flanks, and cavalry that fought with pistols and
      carbines as much as swords. At Lützen, near Leipzig, on 16 November 1632 the Swedes
      beat Wallenstein's imperial army but Gustavus Adolphus was killed. A mass grave of 47
      men found there in 2011 is most likely part of the Swedish 'Blue Brigade', surprised
      in the flank by imperial cavalry; it is the source of this group's table.
    sides:
      - name: "Sweden and Protestant allies"
        who: "Swedish and Finnish troops and many German and Scottish mercenaries in Swedish pay, with Saxony and other Protestant states."
        armour: "Pikemen wore helmets and corslets when they kept them; musketeers wore none; cavalry rode in buff coats with helmets and breastplates."
        look: {colour: "#3b5a8c", trousers: "#4a4038", hat: broad_hat, beard: moustache}
      - name: "Imperial army and Catholic League"
        who: "The Emperor's army under Wallenstein and Pappenheim, Bavaria and the Catholic League, and Croat light horse."
        armour: "Cuirassiers in three-quarter plate, harquebusiers in buff coat and breastplate, pikemen in corslets; Croats and musketeers unarmoured."
        look: {colour: "#9a8a6a", trousers: "#4a4038", hat: broad_hat, beard: moustache}
    examples:
      - {name: "Blue Brigade musketeer", side: "Sweden and Protestant allies", kit: none, weapon: matchlock_musket, notes: "Matchlock and bandolier; clubs the musket in the press.", look: {hat: broad_hat}}
      - {name: "Swedish pikeman", side: "Sweden and Protestant allies", kit: pikeman_1630, weapon: spear, notes: "Pike about 5 m long."}
      - {name: "Finnish hakkapeliitta", side: "Sweden and Protestant allies", kit: harquebusier_1630, weapon: saber, notes: "Light cavalry: pistols, then swords at the gallop."}
      - {name: "Imperial cuirassier", side: "Imperial army and Catholic League", kit: cuirassier_1630, weapon: wheellock_pistol, notes: "Pappenheim's heavy horse; pistols at close range, aimed at the head."}
      - {name: "Imperial harquebusier", side: "Imperial army and Catholic League", kit: harquebusier_1630, weapon: wheellock_pistol, notes: "Carbine and pistols; most of the balls in the Lützen grave are carbine shot."}
      - {name: "Croat light horseman", side: "Imperial army and Catholic League", kit: none, weapon: saber, notes: "Raiders and skirmishers."}
    sources:
      - "Nicklisch et al., PLoS ONE 12(5): e0178252 (2017): the Lützen mass grave, the Blue Brigade, and contemporary advice to aim for the head and left chest."
      - "Sides, armour and dress: general historical knowledge, not from the grave study."

  "American Revolution":
    period: "1775-1783"
    summary: >
      The thirteen colonies, joined by France from 1778 and later Spain and the Dutch
      Republic, fought Britain for independence. Battles were fought with smoothbore
      muskets and bayonets at close range, with artillery firing round shot, grape and
      canister; riflemen picked off officers from cover; dragoons fought with the sabre.
      Bayonet charges decided many fights, and some ended in killings of men trying to
      surrender, such as Paoli (1777) and Waxhaws (1780). Peckham counted 7,174 Americans
      killed and 8,241 wounded in action. The tables here are tallied from the men
      disabled for life who claimed federal invalid pensions in 1792-95.
    sides:
      - name: "Continental Army and militia"
        who: "Continental regulars, state militia, riflemen, light dragoons, and the Continental Navy and privateers."
        armour: "None. Officers wore a small gorget as a mark of rank; light dragoons wore leather helmets."
        look: {colour: "#2f3f6e", trousers: "#e8e4d8", hat: tricorne}
      - name: "British Army and Loyalists"
        who: "British regulars and marines, Loyalist provincial regiments and rangers, and the Royal Navy."
        armour: "None. Grenadiers' bearskin caps and light infantry caps gave no protection; light dragoons wore crested leather helmets."
        look: {colour: "#b3262b", trousers: "#e8e4d8", hat: tricorne}
      - name: "German auxiliaries"
        who: "Regiments hired from Hesse-Kassel, Brunswick and other German states ('Hessians'), including Jäger riflemen."
        armour: "None; grenadiers wore brass-fronted mitre caps, which were not armour."
        look: {colour: "#2f3f6e", trousers: "#e3d9a8", hat: tricorne, beard: moustache}
      - name: "French forces"
        who: "Rochambeau's expeditionary army and the French navy, from 1778; decisive at Yorktown in 1781."
        armour: "None."
        look: {colour: "#e8e4d8", trousers: "#e8e4d8", hat: tricorne}
      - name: "Native nations"
        who: "Warriors on both sides: most of the Mohawk, Seneca and Cherokee fought with Britain; the Oneida and Tuscarora with the Americans."
        armour: "None. Musket, tomahawk and knife; raids and ambushes on the frontier."
        look: {colour: "#9a7347", trousers: "#7d5530", hat: feather}
    examples:
      - {name: "Continental infantryman", side: "Continental Army and militia", kit: none, weapon: musket_smoothbore, notes: "Musket and bayonet."}
      - {name: "Morgan's rifleman", side: "Continental Army and militia", kit: none, weapon: rifle_flintlock, notes: "Long rifle, slow to load, deadly at range; no bayonet.", look: {colour: "#a99b72", trousers: "#a99b72", hat: round_hat}}
      - {name: "Continental light dragoon", side: "Continental Army and militia", kit: dragoon_helmet, weapon: saber, notes: "Leather helmet and sabre."}
      - {name: "British grenadier", side: "British Army and Loyalists", kit: none, weapon: bayonet, notes: "The bayonet charge was the British infantry's favoured tactic.", look: {hat: bearskin}}
      - {name: "Loyalist ranger", side: "British Army and Loyalists", kit: none, weapon: musket_smoothbore, notes: "Frontier raids alongside Native allies.", look: {colour: "#3f5a32"}}
      - {name: "British light dragoon", side: "British Army and Loyalists", kit: dragoon_helmet, weapon: saber, notes: "Tarleton's British Legion fought with sabres at Waxhaws."}
      - {name: "Hessian Jäger", side: "German auxiliaries", kit: none, weapon: rifle_flintlock, notes: "German hunters' rifle, short and accurate.", look: {colour: "#3f5a32", trousers: "#3f5a32"}}
      - {name: "Hessian musketeer", side: "German auxiliaries", kit: none, weapon: musket_smoothbore, notes: "Line infantry; musket and bayonet.", look: {hat: mitre}}
      - {name: "French fusilier", side: "French forces", kit: none, weapon: musket_smoothbore, notes: "Charleville musket; Yorktown 1781."}
      - {name: "Mohawk warrior", side: "Native nations", kit: none, weapon: axe, notes: "Tomahawk and musket."}
      - {name: "Oneida scout", side: "Native nations", kit: none, weapon: musket_smoothbore, notes: "Allied with the Americans."}
    sources:
      - "Peckham, The Toll of Independence (1974), via Journal of the American Revolution, 'The 25 Deadliest Battles of the Revolutionary War' (2014): 7,174 killed and 8,241 wounded."
      - "Federal Revolutionary War Invalid Pension Claims, 1792-1795, Magazine of Early American Datasets (Penn, 2021)."
      - "Sides, alliances and dress: general historical knowledge, not from the pension data."

  "Napoleonic era & War of 1812":
    period: "1803-1815"
    summary: >
      France under Napoleon against shifting coalitions of Britain, Austria, Prussia,
      Russia, Spain and Portugal. In the Peninsular War (1808-1814) a British and
      Portuguese army under Wellington, with Spanish armies and guerrillas, drove the French
      out of Spain; the wound tables come from French officers' files of that war. At the
      same time (1812-1815) the United States fought Britain in North America, with the
      same weapons: smoothbore muskets and bayonets, rifles, sabres and smoothbore
      artillery. Many British regulars in the later War of 1812 were Peninsular veterans.
      No region-by-region wound count survives for the War of 1812, so it uses these
      tables.
    sides:
      - name: "French Empire and allies"
        who: "French line and light infantry, cavalry and artillery, with Polish, German and Italian allies."
        armour: "Cuirassiers and carabiniers wore steel breastplates and backplates and helmets; dragoons wore brass helmets; infantry wore none."
        look: {colour: "#2f3f6e", trousers: "#e8e4d8", hat: shako, beard: moustache}
      - name: "Britain and Peninsular allies"
        who: "Wellington's British and Portuguese army (including the 95th Rifles), Spanish regular armies and guerrillas."
        armour: "None for infantry; heavy and light dragoons wore helmets. British Household Cavalry wore cuirasses only after 1815."
        look: {colour: "#b3262b", trousers: "#6b6f75", hat: shako}
      - name: "United States (1812-15)"
        who: "US regulars, state militia (including Kentucky riflemen), US Navy and Marines."
        armour: "None; some light dragoons wore leather helmets."
        look: {colour: "#2f3f6e", trousers: "#e8e4d8", hat: shako}
      - name: "British North America (1812-15)"
        who: "British regulars, Canadian fencibles and militia, the Royal Navy, and the Provincial Marine."
        armour: "None."
        look: {colour: "#b3262b", trousers: "#6b6f75", hat: shako}
      - name: "Tecumseh's confederacy"
        who: "Shawnee, Potawatomi, Kickapoo and other nations under Tecumseh, allied with Britain until his death at the Thames (1813)."
        armour: "None. Musket, rifle, tomahawk and war club."
        look: {colour: "#9a7347", trousers: "#7d5530", hat: feather}
    examples:
      - {name: "French line infantryman", side: "French Empire and allies", kit: none, weapon: musket_smoothbore, notes: "Charleville musket and bayonet."}
      - {name: "French cuirassier", side: "French Empire and allies", kit: cuirassier, weapon: saber, notes: "Heavy cavalry: straight sword, breastplate and helmet."}
      - {name: "Polish lancer", side: "French Empire and allies", kit: none, weapon: lance, notes: "Vistula Legion lancers, feared at Albuera (1811).", look: {hat: czapka, trousers: "#2f3f6e"}}
      - {name: "British redcoat", side: "Britain and Peninsular allies", kit: none, weapon: musket_smoothbore, notes: "Brown Bess and bayonet, firing in two-deep line."}
      - {name: "95th rifleman", side: "Britain and Peninsular allies", kit: none, weapon: rifle_flintlock, notes: "Baker rifle; skirmisher and sniper.", look: {colour: "#2f4a2a", trousers: "#2f4a2a"}}
      - {name: "British heavy dragoon", side: "Britain and Peninsular allies", kit: dragoon_helmet, weapon: saber, notes: "1796 heavy cavalry sword.", look: {trousers: "#e8e4d8"}}
      - {name: "Spanish guerrilla", side: "Britain and Peninsular allies", kit: none, weapon: musket_smoothbore, notes: "Ambushes of convoys and couriers.", look: {colour: "#7d5530", trousers: "#4a4038", hat: broad_hat, beard: beard}}
      - {name: "US regular, 1814", side: "United States (1812-15)", kit: none, weapon: musket_smoothbore, notes: "Chippawa and Lundy's Lane; Springfield musket.", look: {colour: "#8a8f96", trousers: "#8a8f96"}}
      - {name: "Kentucky militia rifleman", side: "United States (1812-15)", kit: none, weapon: rifle_flintlock, notes: "River Raisin, the Thames, New Orleans.", look: {colour: "#a99b72", trousers: "#7d5530", hat: round_hat}}
      - {name: "British regular, 1814", side: "British North America (1812-15)", kit: none, weapon: musket_smoothbore, notes: "Often a Peninsular veteran."}
      - {name: "Canadian militiaman", side: "British North America (1812-15)", kit: none, weapon: musket_smoothbore, notes: "Sedentary or embodied militia.", look: {colour: "#4a4f55", hat: round_hat}}
      - {name: "Shawnee warrior", side: "Tecumseh's confederacy", kit: none, weapon: axe, notes: "Tomahawk and musket."}
    sources:
      - "Planas Campos and Grajal de Blas, British Journal for Military History 7(3), 2021 (Peninsular War wound database)."
      - "Sides, armour and dress: general historical knowledge, not from the wound data."

  "American Civil War":
    period: "1861-1865"
    summary: >
      The United States (Union) against the seceded Confederate States. Most wounds came
      from the rifle-musket firing soft lead conoidal balls, which shattered bone and led
      to the war's many amputations. Artillery, especially canister at close range, did
      the rest; sabre and bayonet wounds were rare.
    sides:
      - name: "Union"
        who: "US Regular Army and state volunteer regiments."
        armour: "None issued. In 1862 private 'bullet-proof vests' (Atwater, G&D Cook) sold by the thousand; at about 8 lb most were thrown away on the march, and wearing one was thought unmanly."
        look: {colour: "#2f3f6e", trousers: "#6f88b0", hat: kepi}
      - name: "Confederacy"
        who: "Confederate States Army and state troops."
        armour: "None issued; private vests were rarer still."
        look: {colour: "#8a8f96", trousers: "#6b6f75", hat: slouch, beard: beard}
    examples:
      - {name: "Union infantryman", side: "Union", kit: none, weapon: rifle_musket, notes: "Springfield rifle-musket, no armour."}
      - {name: "Union volunteer with steel vest, 1862", side: "Union", kit: acw_steel_vest, weapon: rifle_musket, notes: "One of the few who kept his vest."}
      - {name: "Confederate cavalryman", side: "Confederacy", kit: none, weapon: revolver, notes: "Revolver and sabre.", look: {hat: slouch}}
      - {name: "Confederate infantryman", side: "Confederacy", kit: none, weapon: rifle_musket, notes: "Enfield or Springfield rifle-musket, no armour."}
      - {name: "Union cavalryman", side: "Union", kit: none, weapon: saber, notes: "Sabre charge; carbine and revolver as well.", look: {trousers: "#6f88b0"}}
    sources:
      - "Antietam on the Web, 'Saved by his steel vest' (2018): Atwater and G&D Cook vests, sales and use."

  "American Indian Wars":
    period: "1862-1871 (arrow reports)"
    summary: >
      After the Civil War the US Army garrisoned the Plains and the Southwest and fought a
      long series of campaigns against the nations whose land the railways and settlers
      were entering: on the Plains the Lakota (Sioux), Cheyenne, Arapaho, Kiowa and Comanche;
      in Arizona, New Mexico and Texas the Apache, Navajo and Lipan. Most fights were raids,
      ambushes of herders, mail escorts and wagon trains, and skirmishes between small
      parties. Warriors used firearms when they could get them; younger and poorer men
      still fought with the bow, which in skilled hands loosed several arrows in the time a
      soldier reloaded. The Army's surgeons wrote up 83 arrow cases from 1865-71; the table
      here is tallied from them.
    sides:
      - name: "US Army"
        who: "Regular cavalry and infantry posted to frontier forts, with Indian scouts and civilian herders, teamsters and settlers."
        armour: "None. Wool uniform; the cavalry fought mounted or dismounted with carbine, revolver and sabre."
        look: {colour: "#2f3f6e", trousers: "#6f88b0", hat: slouch, beard: moustache}
      - name: "Plains and Southwest nations"
        who: "Lakota, Cheyenne, Arapaho, Kiowa, Comanche, Apache, Navajo and Lipan warriors, in raiding and war parties."
        armour: "None worn. Many warriors carried a round shield of thick rawhide (buffalo hide on the Plains), which could turn an arrow or a glancing ball."
        look: {colour: "#9a7347", trousers: "#7d5530", hat: feather}
    examples:
      - {name: "Plains warrior with bow", side: "Plains and Southwest nations", kit: rawhide_shield, weapon: bow, notes: "Iron trade-hoop or flint arrowheads; several arrows in quick succession."}
      - {name: "Comanche lancer", side: "Plains and Southwest nations", kit: rawhide_shield, weapon: spear, notes: "Mounted with lance and shield."}
      - {name: "Apache raider", side: "Plains and Southwest nations", kit: none, weapon: bow, notes: "Ambush from cover; hoop-iron arrowheads.", look: {colour: "#e8e4d8", trousers: "#9a7347", hat: headband}}
      - {name: "US cavalry trooper", side: "US Army", kit: none, weapon: revolver, elsewhere: true, notes: "No arrow-era gunshot table exists; his revolver rolls on a Civil War table."}
      - {name: "US infantryman", side: "US Army", kit: none, weapon: rifle_musket, elsewhere: true, notes: "Springfield rifle (rolls on a Civil War table)."}
      - {name: "Indian scout", side: "US Army", kit: none, weapon: bow, notes: "Several scouts in the reports were themselves hit by arrows.", look: {colour: "#2f3f6e", trousers: "#7d5530", hat: headband}}
    sources:
      - "US Surgeon General's Office, Circular No. 3 (1871), 'Arrow-Wounds', pp. 144-161 (archive.org: reportofsurgical00unituoft). Places, tribes, units and the note on firearms and bows are from the case reports and Dr. Muller's note there."
      - "Rawhide shields: general ethnographic description, not from the report."

  "WWI":
    period: "1914-1918"
    summary: >
      The Allied powers (France, the British Empire, Russia, Italy, and from 1917 the
      United States) against the Central Powers (Germany, Austria-Hungary, the Ottoman
      Empire and Bulgaria). Trench warfare made artillery the main killer and the head
      the most exposed target, which drove the return of the steel helmet.
    sides:
      - name: "Allies"
        who: "French, British Empire, Russian, Italian and American armies."
        armour: "Cloth caps and kepis in 1914. Steel helmets from 1915-16: the French Adrian, then the British Brodie. A little private-purchase body armour; Italian assault engineers used heavy plate."
        look: {colour: "#7a6e48", hat: field_cap, helmet: brodie, beard: moustache}
      - name: "Central Powers"
        who: "German, Austro-Hungarian, Ottoman and Bulgarian armies."
        armour: "German Stahlhelm from 1916. Heavy Sappenpanzer breastplates for sentries and machine gunners in fixed positions."
        look: {colour: "#6f7569", hat: field_cap, helmet: stahlhelm, beard: moustache}
    examples:
      - {name: "French poilu, 1914", side: "Allies", kit: none, weapon: rifle_service, notes: "Kepi, no helmet yet.", look: {colour: "#3f4f7a", trousers: "#a3262b", hat: kepi}}
      - {name: "British infantryman, 1916", side: "Allies", kit: ww2_rifleman, weapon: rifle_service, notes: "Brodie helmet, Lee-Enfield."}
      - {name: "German machine gunner", side: "Central Powers", kit: ww1_sentry, weapon: machine_gun, notes: "Stahlhelm and Sappenpanzer in a fixed position."}
      - {name: "Trench raider, 1917", side: "Allies", kit: ww2_rifleman, weapon: entrenching_tool, notes: "Night raid: sharpened spade, revolver and grenades; no rifle in the trench."}
      - {name: "Russian infantryman, 1915", side: "Allies", kit: none, weapon: bayonet, notes: "Most Russian soldiers had no steel helmet; the army set great store by the bayonet.", look: {colour: "#8a8458", hat: field_cap}}
      - {name: "Italian Ardito, 1918", side: "Allies", kit: ww2_rifleman, weapon: hand_grenade, notes: "Assault trooper: Adrian helmet, grenades and dagger.", look: {colour: "#6f7560", helmet: adrian}}
      - {name: "American doughboy, 1918", side: "Allies", kit: ww2_rifleman, weapon: rifle_service, notes: "M1917 (Brodie-pattern) helmet, Springfield rifle.", look: {colour: "#6f6a48"}}
      - {name: "German stormtrooper, 1918", side: "Central Powers", kit: ww2_rifleman, weapon: hand_grenade, notes: "Stahlhelm; grenades, carbine and sharpened spade."}
      - {name: "Austro-Hungarian infantryman", side: "Central Powers", kit: ww2_rifleman, weapon: rifle_service, notes: "Steel helmet from 1916-17; Mannlicher rifle.", look: {colour: "#7f8a8c"}}
      - {name: "Ottoman infantryman, Gallipoli", side: "Central Powers", kit: none, weapon: rifle_service, notes: "Cloth headgear, no steel helmet; Mauser rifle.", look: {colour: "#8a7a52", hat: kabalak}}
      - {name: "Bulgarian infantryman", side: "Central Powers", kit: none, weapon: rifle_service, notes: "Mostly without steel helmets; Mannlicher rifle.", look: {colour: "#6f6a50", hat: field_cap}}
    sources:
      - "Military Wiki, 'Stahlhelm' (introduction of German and Allied steel helmets)."

  "WWII":
    period: "1939-1945 (Bougainville 1943-45; Italy 1943-45)"
    summary: >
      The Allies against the Axis. This group's tables come from two theatres: the
      jungle campaign on Bougainville in the Solomon Islands (US Marines and Army against
      the Imperial Japanese Army) and the Italian campaign (US, British and Commonwealth
      forces against the German army). Mortars and artillery caused half of the
      Bougainville wounds.
    sides:
      - name: "Allies"
        who: "US Army and Marine Corps; British and Commonwealth armies in Italy; the Australian army, which took over Bougainville from late 1944."
        armour: "Steel helmets (M1, Brodie) for all infantry, no body armour. Bomber crews wore steel-plate flak vests from 1943."
        look: {colour: "#5d6449", helmet: m1}
      - name: "Axis"
        who: "Imperial Japanese Army; German Wehrmacht."
        armour: "Steel helmets (Japanese Type 90, German Stahlhelm); no infantry body armour."
        look: {colour: "#6f7569", helmet: stahlhelm}
    examples:
      - {name: "US Marine, Bougainville", side: "Allies", kit: ww2_rifleman, weapon: rifle_service, notes: "M1 helmet, M1 Garand."}
      - {name: "Japanese infantryman", side: "Axis", kit: ww2_rifleman, weapon: hand_grenade, notes: "Type 90 helmet; grenades and knee mortars at close range.", look: {colour: "#7d7448", helmet: japanese}}
      - {name: "German MG gunner, Italy", side: "Axis", kit: ww2_rifleman, weapon: machine_gun, notes: "Stahlhelm, MG 42."}
      - {name: "US bomber waist gunner", side: "Allies", kit: aircrew_flak, weapon: machine_gun, notes: "Flak vest and helmet; not an infantry kit."}
      - {name: "British infantryman, Italy", side: "Allies", kit: ww2_rifleman, weapon: rifle_service, notes: "Brodie helmet, Lee-Enfield; Eighth Army.", look: {colour: "#7a6e48", helmet: brodie}}
      - {name: "Australian infantryman, Bougainville 1945", side: "Allies", kit: none, weapon: pistol_smg, notes: "Often a slouch hat rather than a helmet in the jungle; Owen submachine gun.", look: {colour: "#5d6449", hat: slouch}}
      - {name: "German paratrooper, Cassino", side: "Axis", kit: ww2_rifleman, weapon: pistol_smg, notes: "Rimless paratrooper helmet, MP 40; fought as infantry.", look: {helmet: fj}}
    sources:
      - "Borden Institute, Weapons Effects and War Wounds, Table 1-1 (Bougainville causes of injury)."

  "Korea":
    period: "1950-1953"
    summary: >
      The United Nations Command, led by the United States with South Korea, the British
      Commonwealth and others, against North Korea and, from late 1950, the Chinese
      People's Volunteer Army. Fighting swung from mobile war to static trench lines,
      where body armour first came into general use.
    sides:
      - name: "UN Command"
        who: "US, South Korean, British Commonwealth and other UN forces."
        armour: "Steel helmets. The US Marines fielded the M1951 vest with Doron plates; the Army's nylon M-1952 reached front-line troops in late 1952, in small numbers."
        look: {colour: "#5d6449", helmet: m1}
      - name: "North Korea and China"
        who: "Korean People's Army; Chinese People's Volunteer Army."
