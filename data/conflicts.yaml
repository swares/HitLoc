      - {name: "British heavy dragoon", side: "Britain and Peninsular allies", kit: dragoon_helmet, weapon: saber, notes: "1796 heavy cavalry sword.", look: {trousers: "#e8e4d8"}, image: {file: "Uniform of a Private of the 3rd or Kings Own Dragoons.jpg", caption: "Private of the 3rd (King's Own) Dragoons, by Charles Hamilton Smith, 1812"}}
      - {name: "Spanish guerrilla", side: "Britain and Peninsular allies", kit: none, weapon: musket_smoothbore, notes: "Ambushes of convoys and couriers.", look: {colour: "#7d5530", trousers: "#4a4038", hat: broad_hat, beard: beard}, image: {file: "Goya-Guerra (02).jpg", caption: "Spaniards attack French soldiers: Goya, The Disasters of War, plate 2 (1810s)"}}
      - {name: "US regular, 1814", side: "United States (1812-15)", kit: none, weapon: musket_smoothbore, notes: "Chippawa and Lundy's Lane; Springfield musket.", look: {colour: "#8a8f96", trousers: "#8a8f96"}, image: {file: "Battle of New Orleans Jean-Hyacinthe Laclotte.jpg", caption: "The American lines at New Orleans, 8 January 1815, painted by an eyewitness, Hyacinthe Laclotte"}}
      - {name: "Kentucky militia rifleman", side: "United States (1812-15)", kit: none, weapon: rifle_flintlock, notes: "River Raisin, the Thames, New Orleans.", look: {colour: "#a99b72", trousers: "#7d5530", hat: round_hat}, image: {file: "Battle of the Thames and the death of Tecumseh, by the Kentucky mounted volunteers led by Colonel Richard M. Johnson, 5th Oct. 1813 LCCN91790904.jpg", caption: "Kentucky mounted volunteers at the Thames, 1813 (print of 1833)"}}
